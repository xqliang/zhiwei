            <button class="btn mini" v-if="deletingTopicId !== t.id && dismissingTopicId !== t.id" @click="askDismissTopic(t)">忽略</button>
            <button v-if="deletingTopicId !== t.id && dismissingTopicId !== t.id" class="btn mini" @click="askDeleteTopic(t)">删除</button>
            <button v-if="dismissingTopicId === t.id" class="btn warn" @click="confirmDismissTopic(t)">确认忽略?</button>
            <button v-if="dismissingTopicId === t.id" class="btn ghost" @click="cancelDismissTopic()">取消</button>
            <button v-if="deletingTopicId === t.id" class="btn danger" @click="confirmDeleteTopic(t)">确认删除?</button>
            <button v-if="deletingTopicId === t.id" class="btn ghost" @click="cancelDeleteTopic()">取消</button>
          </div>
        </div>
      </div>
      <div class="card" v-if="manualMergeMode" style="position:sticky; bottom:0">
        <div class="kv">
          <div class="muted">已选 {{ manualSelected.length }} 个主题</div>
          <div style="display:flex; gap:8px">
            <button v-if="!manualConfirming" class="btn primary" style="padding:7px 14px" :disabled="manualSelected.length < 2" @click="startManualConfirm">开始合并</button>
            <template v-else>
              <input class="txt inline" v-model="manualMergeName" placeholder="规范名（必填）">
              <button class="btn primary" style="padding:7px 14px" @click="applyManualMerge">确认合并</button>
            </template>
            <button class="btn mini" @click="cancelManualMerge">取消</button>
          </div>
        </div>
      </div>
      <!-- 已忽略主题折叠区（默认收起） -->
      <template v-if="dismissedTopics.length">
        <div class="todo-group-title" style="cursor:pointer" @click="dismissedCollapsed = !dismissedCollapsed">
          已忽略主题（{{ dismissedTopics.length }}）{{ dismissedCollapsed ? ' ▸' : ' ▾' }}
        </div>
        <template v-if="!dismissedCollapsed">
          <div class="card" v-for="t in dismissedTopics" :key="t.id" style="opacity:.72">
            <div class="kv">
              <div>
                <b>{{ t.name }}</b>
                <div class="muted">{{ t.memory_count }} 条记忆 · {{ t.open_todo_count }} 个进行中待办</div>
              </div>
              <button class="btn mini" @click="restoreTopic(t)">恢复</button>
            </div>
          </div>
        </template>
      </template>
    </template>

    <!-- 详情视图：改名就地并入 header，不再独占一行 -->
    <template v-else>
      <div class="kv" style="margin-bottom:14px; align-items:flex-start">
        <div style="min-width:0; flex:1">
          <template v-if="renaming===null">
            <b class="editable" @click="startRename(topicDetail.topic)" title="点击改名" style="font-size:var(--fs-lg)">{{ topicDetail.topic.name }}<span class="hint">✎ 改名</span></b>
            <span v-if="topicDetail.topic.status==='suggested'" class="badge suggested" style="vertical-align:middle">待确认</span>
          </template>
          <template v-else>
            <input class="txt inline" v-model="renaming.name" @keyup.enter="commitRename" style="font-size:var(--fs-md); max-width:320px">
            <button class="btn primary" style="padding:6px 14px; margin-left:8px" @click="commitRename">保存</button>
            <button class="btn mini" @click="renaming = null">取消</button>
          </template>
          <div class="muted" v-if="topicDetail.topic.description" style="margin-top:4px">{{ topicDetail.topic.description }}</div>
        </div>
        <button class="btn mini" @click="closeTopicDetail">← 返回列表</button>
      </div>
      <div class="todo-group-title">记忆时间线</div>
      <div v-if="!topicDetail.memories || !topicDetail.memories.length" class="card empty">暂无记忆</div>
      <div class="card" v-for="m in topicDetail.memories" :key="m.id">
        <div class="kv">
          <div style="min-width:0">
            <span class="type-tag" :style="{background: typeMeta(m.type).color}">{{ typeMeta(m.type).label }}</span>
            <b v-if="!editingMem || editingMem.id !== m.id" class="editable" @click="startEditMemory(m)" title="点击编辑">{{ m.title }}<span class="hint">✎</span></b>
          </div>
          <!-- 忽略（软删除）：与记忆 tab 同款 2 步行内确认 -->
          <button v-if="dismissingMemId !== m.id" class="btn ghost" @click="askDismissMem(m)" title="忽略此记忆">✕</button>
          <button v-if="dismissingMemId === m.id" class="btn warn" @click="confirmDismissMem(m, reloadTopicDetail)">确认忽略?</button>
          <button v-if="dismissingMemId === m.id" class="btn ghost" @click="cancelDismissMem()">取消</button>
        </div>
        <div v-if="editingMem && editingMem.id === m.id" class="edit-form">
          <input class="txt" v-model="editingMem.title" style="margin-bottom:8px">
          <textarea class="txt" v-model="editingMem.content" rows="3"></textarea>
          <div class="edit-actions" style="margin-top:8px">
            <button class="btn primary" style="padding:6px 14px" @click="saveEditMemory(reloadTopicDetail)">保存</button>
            <button class="btn mini" @click="cancelEditMemory()">取消</button>
          </div>
        </div>
        <div v-else style="margin:6px 0">{{ m.content }}</div>
        <div class="muted">置信 {{ (m.confidence ?? 0).toFixed(2) }}<template v-if="m.event_at"> · {{ fmtTime(m.event_at) }}</template></div>
        <!-- 关联主题管理：✕ 取消关联 + 下拉添加（与其他页记忆卡片一致） -->
        <div class="topic-row">
          <span v-for="tp in topicChips(m)" :key="tp.id" class="chip">{{ tp.name }}<button class="chip-x" @click.stop="removeMemoryTopic(m, tp.id)" title="取消关联">✕</button></span>
          <select class="mini" style="padding:3px 8px" title="关联主题"
                  @change="if($event.target.value){addMemoryTopic(m,$event.target.value);$event.target.value=''}">
            <option value="">+ 关联主题</option>
            <option v-for="t in availableTopics" :key="t.id" :value="t.id">{{ t.name }}</option>
          </select>
        </div>
        <div class="card-actions">
          <div class="muted" v-if="m.session_id" style="cursor:pointer" @click="jumpToSession(m.session_id)">↗ 查看来源对话</div>
        </div>
      </div>
      <div class="todo-group-title">关联待办</div>
      <div v-if="!topicDetail.todos || !topicDetail.todos.length" class="card empty">暂无待办</div>
      <div class="card" v-for="td in topicDetail.todos" :key="td.id">
        <div class="kv">
          <div v-if="!editingTodo || editingTodo.id !== td.id" class="editable" @click="startEditTodo(td)" title="点击编辑">☑️ {{ td.title }}<span class="hint">✎</span></div>
          <div v-else style="min-width:0; flex:1">
            <input class="txt" v-model="editingTodo.title">
          </div>
          <div style="display:flex; gap:6px; flex-shrink:0; align-items:center">
            <span v-if="!editingTodo || editingTodo.id !== td.id" class="badge" :class="td.status">{{ todoStatusText(td.status) }}</span>
            <button v-if="editingTodo && editingTodo.id === td.id" class="btn primary" style="padding:6px 12px" @click="saveEditTodo(reloadTopicDetail)">保存</button>
            <button v-if="editingTodo && editingTodo.id === td.id" class="btn mini" @click="cancelEditTodo()">取消</button>
            <button v-if="(!editingTodo || editingTodo.id !== td.id) && deletingTodoId !== td.id" class="btn mini" @click="askDeleteTodo(td)">删除</button>
            <button v-if="deletingTodoId === td.id" class="btn danger" @click="confirmDeleteTodo(td, reloadTopicDetail)">确认删除?</button>
            <button v-if="deletingTodoId === td.id" class="btn ghost" @click="cancelDeleteTodo()">取消</button>
          </div>
        </div>
        <div class="muted" v-if="td.due_at" :class="{overdue: new Date(td.due_at) < new Date()}">截止 {{ fmtDue(td.due_at) }}</div>
        <div class="topic-row">
          <span v-for="tp in topicChips(td)" :key="tp.id" class="chip">{{ tp.name }}<button class="chip-x" @click.stop="removeTodoTopic(td, tp.id)" title="取消关联">✕</button></span>
          <select class="mini" style="padding:3px 8px" title="关联主题"
                  @change="if($event.target.value){addTodoTopic(td,$event.target.value);$event.target.value=''}">
            <option value="">+ 关联主题</option>
            <option v-for="t in availableTopics" :key="t.id" :value="t.id">{{ t.name }}</option>
          </select>
        </div>
        <div class="muted" v-if="td.source_session_id" style="cursor:pointer" @click="jumpToSession(td.source_session_id)">↗ 查看来源对话</div>
      </div>
    </template>
  </div>

  <!-- ============ 记忆 ============ -->
  <div class="wrap" v-if="tab==='memories'">
    <div class="toolbar">
      <input class="txt" v-model="memSearch" placeholder="搜索记忆标题 / 内容…" style="max-width:280px">
      <select class="mini" v-model="memConfMin">
        <option value="0">全部置信度</option>
        <option value="0.5">置信 ≥ 0.5</option>
        <option value="0.7">置信 ≥ 0.7</option>
        <option value="0.9">置信 ≥ 0.9</option>
      </select>
      <div class="spacer"></div>
      <span class="muted">{{ filteredMemories.length }} 条</span>
    </div>
    <div v-if="!filteredMemories.length" class="card empty">没有匹配的记忆</div>
    <div class="card" v-for="m in filteredMemories" :key="m.id">
      <div class="kv">
        <div style="min-width:0">
          <span class="type-tag" :style="{background: typeMeta(m.type).color}">{{ typeMeta(m.type).label }}</span>
          <b v-if="!editingMem || editingMem.id !== m.id" class="editable" @click="startEditMemory(m)" title="点击编辑">{{ m.title }}<span class="hint">✎</span></b>
        </div>
      </div>
      <div v-if="editingMem && editingMem.id === m.id" class="edit-form">
        <input class="txt" v-model="editingMem.title" style="margin-bottom:8px">
        <textarea class="txt" v-model="editingMem.content" rows="3"></textarea>
        <div class="edit-actions" style="margin-top:8px">
          <button class="btn primary" style="padding:6px 14px" @click="saveEditMemory(loadMemories)">保存</button>
          <button class="btn mini" @click="cancelEditMemory()">取消</button>
        </div>
      </div>
      <div v-else style="margin:6px 0">{{ m.content }}</div>
      <div class="muted">置信 <b style="color:var(--accent)">{{ (m.confidence ?? 0).toFixed(2) }}</b> · 重要度 {{ (m.importance ?? 0).toFixed(1) }}<template v-if="m.event_at"> · {{ fmtTime(m.event_at) }}</template></div>
      <div class="topic-row">
        <span v-for="tp in topicChips(m)" :key="tp.id" class="chip">{{ tp.name }}<button class="chip-x" @click.stop="removeMemoryTopic(m, tp.id)" title="取消关联">✕</button></span>
        <label class="chip-add">+ 关联<select @change="if($event.target.value){addMemoryTopic(m,$event.target.value);$event.target.value=''}"><option value="">+ 关联</option><option v-for="t in availableTopics" :key="t.id" :value="t.id">{{ t.name }}</option></select></label>
      </div>
      <div class="card-actions">
        <div class="muted" v-if="m.session_id" style="cursor:pointer" @click="jumpToSession(m.session_id)">↗ 查看来源对话</div>
        <div style="flex:1"></div>
        <button v-if="dismissingMemId !== m.id" class="btn mini" @click="askDismissMem(m)">忽略</button>
        <button v-if="dismissingMemId === m.id" class="btn warn" @click="confirmDismissMem(m, loadMemories)">确认忽略?</button>
        <button v-if="dismissingMemId === m.id" class="btn ghost" @click="cancelDismissMem()">取消</button>
      </div>
    </div>

  <!-- ============ 待办 ============ -->
  <div class="wrap" v-if="tab==='todos'">
    <!-- 搜索（客户端过滤标题，三个分组共用） -->
    <div class="toolbar">
      <input class="txt" v-model="todoSearch" placeholder="搜索待办标题…" style="max-width:280px">
      <div class="spacer"></div>
      <button class="btn mini" :class="{primary: todoMultiMode}" @click="toggleTodoMultiMode()">
        {{ todoMultiMode ? '退出多选' : '多选' }}
      </button>
      <span class="muted">{{ suggestedTodos.length + activeTodos.length + doneTodos.length }} 条</span>
    </div>
    <div class="todo-group-title" style="display:flex; align-items:center; gap:10px">
      <span>待确认（{{ suggestedTodos.length }}）</span>
      <label v-if="todoMultiMode && suggestedTodos.length" style="font-weight:400; font-size:var(--fs-xs); cursor:pointer; display:flex; align-items:center; gap:4px">
        <input type="checkbox" :checked="suggestedTodos.length > 0 && todoGroupSel(suggestedTodos).length === suggestedTodos.length" @change="toggleTodoGroupSel(suggestedTodos)"> 全选
      </label>
    </div>
    <!-- 批量操作条：本组有勾选才显示。忽略（终态不可恢复）走 2 步确认 -->
    <div v-if="todoMultiMode && todoGroupSel(suggestedTodos).length" class="card" style="padding:8px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#f0f6ff">
      <b style="font-size:var(--fs-sm)">已选 {{ todoGroupSel(suggestedTodos).length }} 条</b>
      <button class="btn mini primary" @click="batchTodoStatus(todoGroupSel(suggestedTodos), 'confirmed')">统一加入</button>
      <button class="btn mini primary" @click="batchTodoStatus(todoGroupSel(suggestedTodos), 'done')">统一完成</button>
      <template v-if="todoBatchAsk && todoBatchAsk.act==='dismiss' && todoBatchAsk.group==='suggested'">
        <button class="btn mini warn" @click="batchTodoStatus(todoGroupSel(suggestedTodos), 'dismissed')">确认忽略 {{ todoGroupSel(suggestedTodos).length }} 条?</button>
        <button class="btn mini ghost" @click="todoBatchAsk = null">取消</button>
      </template>
      <button v-else class="btn mini" @click="todoBatchAsk = {act:'dismiss', group:'suggested'}">统一忽略</button>
      <span style="flex:1"></span>
      <button class="btn mini ghost" @click="toggleTodoGroupSel(suggestedTodos)">全选/清空</button>
    </div>
    <div v-if="!suggestedTodos.length" class="card empty">没有待确认的待办</div>
    <div class="card" v-for="td in suggestedTodos" :key="td.id" style="background:#fffdf5">

        <label v-if="todoMultiMode" style="display:flex; align-items:center; cursor:pointer; flex-shrink:0" title="勾选后可用上方批量操作">
          <input type="checkbox" :checked="todoSel.has(td.id)" @change="toggleTodoSel(td.id)">

        <div v-if="!editingTodo || editingTodo.id !== td.id" class="editable" @click="startEditTodo(td)" title="点击编辑">☑️ {{ td.title }}<span class="hint">✎</span></div>

        <div style="display:flex; gap:6px; flex-shrink:0">

          <button v-if="editingTodo && editingTodo.id === td.id" class="btn mini" @click="cancelEditTodo()">取消</button>

          <button v-if="(!editingTodo || editingTodo.id !== td.id) && deletingTodoId !== td.id && dismissingTodoId !== td.id" class="btn mini" @click="askDismissTodo(td)">忽略</button>
          <button v-if="dismissingTodoId === td.id" class="btn warn" @click="confirmDismissTodo(td)">确认忽略?</button>
          <button v-if="dismissingTodoId === td.id" class="btn ghost" @click="cancelDismissTodo()">取消</button>
          <button v-if="(!editingTodo || editingTodo.id !== td.id) && deletingTodoId !== td.id" class="btn mini" @click="askDeleteTodo(td)">删除</button>
          <button v-if="deletingTodoId === td.id" class="btn danger" @click="confirmDeleteTodo(td, loadTodos)">确认删除?</button>
          <button v-if="deletingTodoId === td.id" class="btn ghost" @click="cancelDeleteTodo()">取消</button>

      <div class="topic-row" v-if="topicChips(td).length || td.status!=='done'">

        <label v-if="td.status!=='done'" class="chip-add">+ 关联<select @change="if($event.target.value){addTodoTopic(td,$event.target.value);$event.target.value=''}"><option value="">+ 关联 Topic</option><option v-for="t in availableTopics" :key="t.id" :value="t.id">{{ t.name }}</option></select></label>
      </div>
      <div class="muted" v-if="td.due_at" :class="{overdue: new Date(td.due_at) < new Date()}">截止 {{ fmtDue(td.due_at) }}</div>
      <div class="muted" v-if="td.source_session_id" style="cursor:pointer" @click="jumpToSession(td.source_session_id)">↗ 查看来源对话</div>

        <input type="checkbox" :checked="activeTodos.length > 0 && todoGroupSel(activeTodos).length === activeTodos.length" @change="toggleTodoGroupSel(activeTodos)"> 全选

    <!-- 批量操作条：完成即改状态；忽略（终态）与删除（硬删）均 2 步确认 -->
    <div v-if="todoMultiMode && todoGroupSel(activeTodos).length" class="card" style="padding:8px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#f0f6ff">

      <button class="btn mini primary" @click="batchTodoStatus(todoGroupSel(activeTodos), 'done')">统一完成</button>
      <template v-if="todoBatchAsk && todoBatchAsk.act==='dismiss' && todoBatchAsk.group==='active'">
        <button class="btn mini warn" @click="batchTodoStatus(todoGroupSel(activeTodos), 'dismissed')">确认忽略 {{ todoGroupSel(activeTodos).length }} 条?</button>
        <button class="btn mini ghost" @click="todoBatchAsk = null">取消</button>

      <button v-else class="btn mini" @click="todoBatchAsk = {act:'dismiss', group:'active'}">统一忽略</button>

      </template>
      <button v-else class="btn mini" @click="todoBatchAsk = {act:'delete', group:'active'}">统一删除</button>
      <span style="flex:1"></span>
      <button class="btn mini ghost" @click="toggleTodoGroupSel(activeTodos)">全选/清空</button>

          <input type="checkbox" :checked="todoSel.has(td.id)" @change="toggleTodoSel(td.id)">
        </label>
        <div v-if="!editingTodo || editingTodo.id !== td.id" class="editable" @click="startEditTodo(td)" title="点击编辑">☑️ {{ td.title }}<span class="hint">✎</span></div>
        <div v-else style="min-width:0; flex:1">
          <input class="txt" v-model="editingTodo.title">
        </div>
        <div style="display:flex; gap:6px; flex-shrink:0">
          <button v-if="editingTodo && editingTodo.id === td.id" class="btn primary" style="padding:6px 12px" @click="saveEditTodo(loadTodos)">保存</button>
          <button v-if="editingTodo && editingTodo.id === td.id" class="btn mini" @click="cancelEditTodo()">取消</button>
          <button v-if="(!editingTodo || editingTodo.id !== td.id) && deletingTodoId !== td.id" class="btn mini" @click="setTodoStatus(td, 'done')">完成</button>
          <button v-if="(!editingTodo || editingTodo.id !== td.id) && deletingTodoId !== td.id && dismissingTodoId !== td.id" class="btn mini" @click="askDismissTodo(td)">忽略</button>
          <button v-if="dismissingTodoId === td.id" class="btn warn" @click="confirmDismissTodo(td)">确认忽略?</button>
          <button v-if="dismissingTodoId === td.id" class="btn ghost" @click="cancelDismissTodo()">取消</button>
          <button v-if="(!editingTodo || editingTodo.id !== td.id) && deletingTodoId !== td.id" class="btn mini" @click="askDeleteTodo(td)">删除</button>
          <button v-if="deletingTodoId === td.id" class="btn danger" @click="confirmDeleteTodo(td, loadTodos)">确认删除?</button>
          <button v-if="deletingTodoId === td.id" class="btn ghost" @click="cancelDeleteTodo()">取消</button>
        </div>
      </div>
      <div class="muted">生成 {{ fmtTime(td.created_at) }}<template v-if="td.status!=='suggested'"> · 处理 {{ fmtTime(td.updated_at) }}</template></div>
      <div class="topic-row" v-if="topicChips(td).length || td.status!=='done'">
        <span v-for="tp in topicChips(td)" :key="tp.id" class="chip">{{ tp.name }}<button class="chip-x" @click.stop="removeTodoTopic(td, tp.id)" title="取消关联">✕</button></span>
        <label v-if="td.status!=='done'" class="chip-add">+ 关联<select @change="if($event.target.value){addTodoTopic(td,$event.target.value);$event.target.value=''}"><option value="">+ 关联 Topic</option><option v-for="t in availableTopics" :key="t.id" :value="t.id">{{ t.name }}</option></select></label>
      </div>
      <div class="muted" v-if="td.due_at" :class="{overdue: new Date(td.due_at) < new Date()}">截止 {{ fmtDue(td.due_at) }}</div>
      <div class="muted" v-if="td.source_session_id" style="cursor:pointer" @click="jumpToSession(td.source_session_id)">↗ 查看来源对话</div>
    </div>

    <div class="todo-group-title" style="cursor:pointer; display:flex; align-items:center; gap:10px" @click="doneCollapsed = !doneCollapsed">
      <span>已完成（{{ doneTodos.length }}）{{ doneCollapsed ? ' ▸' : ' ▾' }}</span>
      <!-- @click.stop：全选不触发行折叠切换 -->
      <label v-if="todoMultiMode && doneTodos.length" @click.stop style="font-weight:400; font-size:var(--fs-xs); cursor:pointer; display:flex; align-items:center; gap:4px">
        <input type="checkbox" :checked="doneTodos.length > 0 && todoGroupSel(doneTodos).length === doneTodos.length" @change="toggleTodoGroupSel(doneTodos)"> 全选
      </label>
    </div>
    <template v-if="!doneCollapsed">
      <!-- 批量操作条：重新打开（done→confirmed）与删除（硬删） -->
      <div v-if="todoMultiMode && todoGroupSel(doneTodos).length" class="card" style="padding:8px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#f0f6ff">
        <b style="font-size:var(--fs-sm)">已选 {{ todoGroupSel(doneTodos).length }} 条</b>
        <button class="btn mini primary" @click="batchTodoStatus(todoGroupSel(doneTodos), 'confirmed')">统一重新打开</button>
        <template v-if="todoBatchAsk && todoBatchAsk.act==='delete' && todoBatchAsk.group==='done'">
          <button class="btn mini danger" @click="batchTodoDelete(todoGroupSel(doneTodos))">确认删除 {{ todoGroupSel(doneTodos).length }} 条?</button>
          <button class="btn mini ghost" @click="todoBatchAsk = null">取消</button>
        </template>
        <button v-else class="btn mini" @click="todoBatchAsk = {act:'delete', group:'done'}">统一删除</button>
        <span style="flex:1"></span>
        <button class="btn mini ghost" @click="toggleTodoGroupSel(doneTodos)">全选/清空</button>
      </div>
      <div v-if="!doneTodos.length" class="card empty">没有已完成的待办</div>
      <div class="card" v-for="td in doneTodos" :key="td.id" style="opacity:.62">
        <div class="kv">
          <label v-if="todoMultiMode" style="display:flex; align-items:center; cursor:pointer; flex-shrink:0" title="勾选后可用上方批量操作">
            <input type="checkbox" :checked="todoSel.has(td.id)" @change="toggleTodoSel(td.id)">
          </label>
          <div>✅ <s>{{ td.title }}</s></div>
          <div style="display:flex; gap:6px">
            <button v-if="deletingTodoId !== td.id" class="btn mini" @click="askDeleteTodo(td)">删除</button>
            <button v-if="deletingTodoId === td.id" class="btn danger" @click="confirmDeleteTodo(td, loadTodos)">确认删除?</button>
            <button v-if="deletingTodoId === td.id" class="btn ghost" @click="cancelDeleteTodo()">取消</button>
          </div>
        </div>
        <div class="muted">生成 {{ fmtTime(td.created_at) }}<template v-if="td.status!=='suggested'"> · 处理 {{ fmtTime(td.updated_at) }}</template></div>
        <div v-if="topicChips(td).length" class="topic-row">
          <span v-for="tp in topicChips(td)" :key="tp.id" class="chip">{{ tp.name }}</span>
        </div>
        <div class="muted" v-if="td.source_session_id" style="cursor:pointer" @click="jumpToSession(td.source_session_id)">↗ 查看来源对话</div>
      </div>
    </template>

    <!-- 已忽略（dismissed 终态，不可恢复，仅供查看+硬删） -->
    <div class="todo-group-title" style="cursor:pointer" @click="dismissedTodoCollapsed = !dismissedTodoCollapsed">
      已忽略（{{ dismissedTodos.length }}）{{ dismissedTodoCollapsed ? ' ▸' : ' ▾' }}
    </div>
    <template v-if="!dismissedTodoCollapsed">
      <div v-if="!dismissedTodos.length" class="card empty">没有已忽略的待办</div>
      <div class="card" v-for="td in dismissedTodos" :key="td.id" style="opacity:.62">
        <div class="kv">
          <div><s>{{ td.title }}</s></div>
          <div style="display:flex; gap:6px">
            <button v-if="deletingTodoId !== td.id" class="btn mini" @click="askDeleteTodo(td)">删除</button>
            <button v-if="deletingTodoId === td.id" class="btn danger" @click="confirmDeleteTodo(td, loadDismissedTodos)">确认删除?</button>
            <button v-if="deletingTodoId === td.id" class="btn ghost" @click="cancelDeleteTodo()">取消</button>
          </div>
        </div>
        <div class="muted">生成 {{ fmtTime(td.created_at) }}</div>
        <div class="muted" v-if="td.source_session_id" style="cursor:pointer" @click="jumpToSession(td.source_session_id)">↗ 查看来源对话</div>
      </div>
    </template>
  </div>
  </template>
</div>

<script src="/app/app.57777052.js"></script>
</body>
</html>
