<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知微</title>
<script src="/app/vendor/vue.global.prod.js"></script>
<style>
  /* ===== 设计系统：暖白纸调 + 深靛蓝点缀 =====
     克制的编辑级品质——靠字号阶梯、分层阴影、字距与微交互立调性，
     而非堆砌色彩。CJK 沿用平台原生 PingFang SC（高品质，非通用 AI 字体）。 */
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #fbfaf6;
    --surface-sunken: #f1ede5;
    --border: #e7e2d6;
    --border-strong: #d6cfbe;
    --text: #2a2825;
    --text-2: #57534c;
    --muted: #9a9388;
    --accent: #4338ca;
    --accent-hover: #3730a3;
    --accent-soft: #eef0fb;
    --accent-2: #0e7490;
    --danger: #b91c1c;
    --danger-soft: #fee2e2;
    --warn: #b45309;
    --warn-soft: #fef3c7;
    --ok: #047857;
    --ok-soft: #d1fae5;
    --shadow: 0 1px 2px rgba(42,40,37,.05), 0 1px 3px rgba(42,40,37,.03);
    --shadow-hover: 0 6px 20px rgba(42,40,37,.09), 0 2px 6px rgba(42,40,37,.05);
    --ring: 0 0 0 3px var(--accent-soft);
    --radius: 14px;
    --radius-sm: 9px;
    --radius-lg: 18px;
    --fs-xs: 12px;
    --fs-sm: 13px;
    --fs-base: 15px;
    --fs-md: 16px;
    --fs-lg: 19px;
    --fs-xl: 23px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(1200px 600px at 50% -200px, #fffdf8 0%, transparent 60%),
      radial-gradient(800px 400px at 100% 100%, #f0ece2 0%, transparent 55%);
    background-attachment: fixed;
    color: var(--text);
    font-size: var(--fs-base);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .num, .muted, .badge, .todo-group-title, .day-group-title { font-variant-numeric: tabular-nums; }

  /* 标签栏：粘性 + 毛玻璃 */
  .tabs {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 2px;
    background: rgba(255,253,248,.88);
    backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 14px;
  }
  .brand { font-weight: 800; font-size: var(--fs-lg); padding: 14px 14px 14px 4px; color: var(--accent); letter-spacing: .04em; }
  .tabs button {
    padding: 14px 14px; border: none; background: none;
    font-size: var(--fs-base); cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
    white-space: nowrap;
  }
  .tabs button:hover { color: var(--text-2); }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 18px 16px 80px; animation: fadeup .28s ease both; }
  /* 时间线页加宽版：宽屏下配合详情双栏（转写 | 记忆/待办）利用横向空间 */
  .wrap.wrap-lg { max-width: 1100px; }
  /* 会话详情双栏：默认（窄屏）单栏纵排；≥960px 且有洞察内容时转写在左、记忆/待办卡片在右。
     无洞察（detailInsights=false）时 aside 不渲染，grid 退化为单列全宽。 */
  .detail-cols { display: flex; flex-direction: column; gap: 0; }
  .detail-aside { min-width: 0; }
  /* 右栏（洞察侧栏）更紧凑的排版：卡片收窄边距、节标题去首距、说明文字降一档 */
  .detail-aside .card { padding: 10px 12px; margin: 8px 0; }
  .detail-aside .todo-group-title { margin: 14px 2px 8px; }
  .detail-aside .muted { font-size: var(--fs-xs); }
  @media (min-width: 960px) {
    .detail-cols.has-aside { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0 18px; align-items: start; }
    /* sticky 偏移避让顶部粘性标签栏（约 48px 高）；内容超高时侧栏内部独立滚动 */
    .detail-aside { position: sticky; top: 64px; max-height: calc(100vh - 76px); overflow-y: auto; }
  }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* 卡片：分层阴影 + 描边 + 顶部高光 */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 12px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.5);
    transition: box-shadow .18s, transform .18s, border-color .18s;
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { box-shadow: var(--shadow-hover), inset 0 1px 0 rgba(255,255,255,.5); transform: translateY(-1px); border-color: var(--border-strong); }
  .card.detail { border-color: var(--border-strong); }
  .card.sunken { background: var(--surface-2); }

  .muted { color: var(--muted); font-size: var(--fs-sm); }
  .kv { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .overdue { color: var(--danger); font-weight: 600; }

  /* 徽标 */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
  .badge.pending, .badge.running, .badge.suggested { background: var(--warn-soft); color: var(--warn); }
  .badge.completed, .badge.done, .badge.active, .badge.confirmed { background: var(--ok-soft); color: var(--ok); }
  .badge.failed { background: var(--danger-soft); color: var(--danger); }
  /* 转写段「已修改」徽章：声纹自动纠正的标记（琥珀色，悬停显示原因）——含幽灵历史声纹改判(原判定 X)与过短噪声段并入 */
  .corrected-badge{display:inline-block;align-self:center;flex-shrink:0;margin-left:2px;padding:0 6px;font-size:var(--fs-xs);line-height:18px;color:#8a6d00;background:#fff4d6;border:1px solid #f0d98a;border-radius:9px;cursor:help}
  .badge.dismissed { background: var(--surface-sunken); color: var(--muted); }

  /* 转写分段 */
  .seg { padding: 10px 0; border-bottom: 1px dashed #ece7da; line-height: 1.7; display: flex; gap: 8px; align-items: flex-start; }
  .seg:last-child { border: none; }
  .sp { font-size: var(--fs-xs); color: #fff; border-radius: 6px; padding: 2px 8px; font-weight: 600; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  .sp1 { background: #4338ca; } .sp2 { background: #0e7490; } .sp3 { background: #b45309; }
  .seg-text { flex: 1; min-width: 0; }
  textarea.seg-edit { width: 100%; margin: 0; font-size: var(--fs-base); line-height: 1.6; resize: vertical; }

  /* 原始 ASR 视图：spk 标签 + 时间戳 + 文本，只读，用于排查 diarization 把同人拆成 spk0/spk1 */
  .seg.raw-asr { flex-wrap: wrap; align-items: baseline; }
  .raw-asr .raw-spk { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); background: var(--surface-sunken); border-radius: 6px; padding: 2px 8px; white-space: nowrap; flex-shrink: 0; }
  .raw-asr .raw-time { font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .raw-asr .raw-text { flex: 1; min-width: 0; }

  /* 按钮：全局不换行 + focus 环 + 按下反馈 */
  button { font-family: inherit; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 9px; cursor: pointer; font-size: var(--fs-sm); font-weight: 500; transition: background .15s, color .15s, filter .12s, transform .04s; white-space: nowrap; }
  .btn:focus-visible { outline: none; box-shadow: var(--ring); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: #fff; padding: 9px 20px; font-size: var(--fs-base); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.primary:disabled { background: #c8c3b4; cursor: not-allowed; }
  .btn.mini { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); padding: 6px 12px; }
  .btn.mini:hover { background: var(--surface-sunken); border-color: var(--border-strong); }
  /* mini 主操作按钮（保存/确认合并/确认切换…）：尺寸与 .btn.mini 完全一致、
     仅背景用主色区分。必须显式声明——.btn.primary 的 9px/20px 大内边距与
     15px 大字号会被 mini 覆盖一半（背景/内边距被覆盖、字号/字重残留），
     造成「同一行两个按钮一大一小、颜色却一样」的错乱。三类选择器(0,3,0)
     优先级高于 .btn.primary(0,2,0)，逐属性钉死。 */
  .btn.mini.primary { background: var(--accent); color: #fff; border-color: var(--accent); padding: 6px 12px; font-size: var(--fs-sm); font-weight: 500; }
  .btn.mini.primary:hover { background: var(--accent-hover); }
  .btn.mini.primary:disabled { background: #c8c3b4; border-color: #c8c3b4; }
  .btn.ghost { background: transparent; color: var(--muted); padding: 6px 10px; }
  .btn.ghost:hover { color: var(--text-2); background: var(--surface-sunken); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); padding: 6px 12px; border: 1px solid #f3caca; }
  .btn.warn { background: var(--warn-soft); color: var(--warn); padding: 6px 12px; }
  .btn:disabled { cursor: not-allowed; opacity: .7; }
  .btn-link { background: none; border: none; color: var(--muted); cursor: pointer; font-size: var(--fs-sm); padding: 2px 4px; }
  .btn-link:hover { color: var(--text-2); }

  select.mini, input[type=date].mini { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: var(--fs-sm); color: var(--text-2); cursor: pointer; font-family: inherit; }
  select.mini:focus, input[type=date].mini:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }

  #drop { border: 2px dashed var(--border-strong); border-radius: var(--radius-lg); padding: 44px; text-align: center; color: var(--muted); margin-bottom: 14px; background: var(--surface); transition: border-color .15s, color .15s, background .15s; }
  #drop:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  #drop.rec { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }

  /* 右上角堆叠 toast：多条并行提示各自独立显示/消失（单条时代后到的会顶掉先到的） */
  .toast-stack { position: fixed; top: 24px; right: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 99; pointer-events: none; max-width: 340px; }
  .toast { background: var(--text); color: #fff; padding: 11px 22px; border-radius: 10px; font-size: var(--fs-sm); box-shadow: var(--shadow-hover); word-break: break-word; animation: toast-in .18s ease-out; }
  @keyframes toast-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  .type-tag { display: inline-block; color: #fff; border-radius: 6px; padding: 2px 9px; font-size: var(--fs-xs); margin-right: 8px; font-weight: 600; white-space: nowrap; }

  .todo-group-title { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 22px 2px 10px; }
  .day-group-title { font-size: var(--fs-sm); font-weight: 700; color: var(--text-2); margin: 20px 2px 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .day-group-title .muted { font-weight: 500; }

  /* 输入框 */
  input.txt, textarea.txt { border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font-size: var(--fs-base); width: 100%; background: #fff; font-family: inherit; line-height: 1.6; transition: border-color .15s, box-shadow .15s; }
  input.txt:focus, textarea.txt:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
  /* select.txt：与 input.txt 同款描边/圆角/内距/字号，补上 inline 样式无法表达的 :focus 环与高度对齐 */
  select.txt {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 12px; font-size: var(--fs-base); font-family: inherit; color: var(--text);
    line-height: 1.6; transition: border-color .15s, box-shadow .15s;
    width: auto; /* input.txt 的 width:100% 会破坏 flex 行的 min-width 布局，select 保持自适应 */
  }
  select.txt:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
  textarea.txt { resize: vertical; }
  input.inline { width: auto; min-width: 160px; display: inline-block; }

  /* 就地可编辑：hover 淡底 + ✎ 提示 */
  .editable { cursor: text; border-radius: 6px; padding: 1px 6px; margin: -1px -6px; transition: background .15s, box-shadow .15s; position: relative; display: inline; }
  .editable:hover { background: var(--accent-soft); }
  .editable .hint { opacity: 0; margin-left: 6px; font-size: var(--fs-xs); color: var(--accent); font-weight: 500; transition: opacity .15s; }
  .editable:hover .hint { opacity: .85; }
  .edit-form { margin-top: 6px; }
  .edit-form textarea.txt { margin-bottom: 8px; }
  .edit-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .card-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .field-label { display: block; font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  /* topic 标签编辑行：已有 chip（带 ✕）+ 「+ 关联」虚线胶囊下拉，内联紧凑 */
  .topic-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-xs); font-weight: 500; line-height: 1.4; cursor: default; }
  /* 只读状态药丸（AI/置信度/直述/待确认等，无删除×）：右侧对称内边距 + 左外边距分隔，避免贴太近 */
  .chip.chip-ro { padding: 3px 10px; margin-left: 6px; }
  /* 溯源跳转药丸：点击跳到来源录音时间线（自动提取物才有 session_id） */
  .chip-ro.src-link { cursor: pointer; background: var(--surface-sunken); color: var(--accent); }
  .chip-ro.src-link:hover { background: var(--accent-soft); text-decoration: underline; }
  /* 声学环境徽章行：场景/背景音/天气/氛围 chip 自动换行排列 */
  .agent-env-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip-x { background: none; border: none; color: inherit; opacity: .45; cursor: pointer; font-size: 11px; padding: 0 4px; line-height: 1; }
  .chip-x:hover { opacity: 1; }
  .chip-add { position: relative; display: inline-flex; align-items: center; padding: 3px 12px; border-radius: 99px; border: 1px dashed var(--border-strong); color: var(--muted); font-size: var(--fs-xs); cursor: pointer; background: var(--surface); white-space: nowrap; }
  .chip-add:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .chip-add select { position: absolute; inset: 0; opacity: 0; cursor: pointer; border: none; background: none; font-size: var(--fs-xs); }

  /* 工具栏（搜索 / 过滤） */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input, .toolbar select, .toolbar .btn { height: 36px; box-sizing: border-box; }
  .toolbar input.txt { max-width: 260px; }
  .toolbar .spacer { flex: 1; }
  /* 时间快捷方式 */
  .preset-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .preset { height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: var(--fs-xs); cursor: pointer; transition: background .15s, color .15s, border-color .15s; white-space: nowrap; font-family: inherit; }
  .preset:hover { border-color: var(--border-strong); background: var(--surface-sunken); }
  .preset.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 空状态 */
  .empty { text-align: center; padding: 32px 12px; color: var(--muted); }

  /* 加载骨架 + 旋转 */
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-sunken) 25%, #efebe1 37%, var(--surface-sunken) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; margin: 8px 0; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .skeleton-line.short { width: 40%; }
  .skeleton-line.med { width: 70%; }

  /* ===== 问知微（流式对话页） =====
     暖白纸 + 靛蓝：沿用卡片/徽标/CSS 变量，与其余 tab 一致。 */
  .wrap.wrap-lg { max-width: 1100px; } /* 聊天页加宽（左列表 + 右消息流） */
  .agent-shell { display: flex; gap: 16px; align-items: flex-start; }
  .agent-convos { width: 220px; flex-shrink: 0; }
  .agent-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  @media (max-width: 760px) {
    .agent-shell { flex-direction: column; }
    .agent-convos { width: 100%; }
  }
  /* 会话列表项 */
  .agent-convo-item { padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; margin-bottom: 6px; transition: background .15s, border-color .15s; }
  .agent-convo-item:hover { background: var(--surface-sunken); }
  .agent-convo-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .agent-convo-item b { display: block; font-size: var(--fs-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 会话列表项：时间 + hover 才显的编辑/删除按钮分列两端 */
  .agent-convo-meta { font-size: var(--fs-xs); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  /* 编辑/删除按钮：始终占位（display 不变），仅用 visibility 切换显隐——hover 出现时行高恒定、不抖动 */
  .agent-convo-ops { display: inline-flex; gap: 4px; visibility: hidden; }
  .agent-convo-item:hover .agent-convo-ops { visibility: visible; }
  .agent-convo-ops-confirm { display: inline-flex; gap: 4px; }
  .danger-text { color: var(--danger); }
  .btn.xs { padding: 1px 6px; font-size: var(--fs-xs); line-height: 1.4; }
  .btn.xs.danger { color: var(--danger); border-color: transparent; }
  .btn.xs.danger:hover { background: var(--danger-soft); }
  .agent-convo-edit { width: 100%; box-sizing: border-box; font-size: var(--fs-sm); padding: 4px 6px; }
  .agent-conn { font-size: var(--fs-xs); font-weight: 600; }

  /* 消息流：独立滚动区，避让顶部粘性标签栏与底部输入 */
  .agent-stream { min-height: 340px; max-height: calc(100vh - 240px); overflow-y: auto; padding: 8px 4px; display: flex; flex-direction: column; gap: 12px; }
  .chat-msg { display: flex; }
  .chat-msg.user { justify-content: flex-end; }
  .chat-msg.assistant { justify-content: flex-start; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: var(--radius); font-size: var(--fs-base); line-height: 1.65; word-break: break-word; box-shadow: var(--shadow); }
  .bubble.user { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.assistant { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble.assistant p { margin: 0 0 8px; }
  .bubble.assistant p:last-child { margin-bottom: 0; }
  .bubble.assistant ul, .bubble.assistant ol { margin: 6px 0; padding-left: 20px; }
  .bubble.assistant a { color: var(--accent); }
  .bubble.assistant .chat-h { font-weight: 600; line-height: 1.3; margin: 10px 0 4px; }
  .bubble.assistant .chat-h:first-child { margin-top: 0; }
  .bubble.assistant h1.chat-h { font-size: 1.25em; }
  .bubble.assistant h2.chat-h { font-size: 1.18em; }
  .bubble.assistant h3.chat-h { font-size: 1.1em; }
  .bubble.assistant h4.chat-h, .bubble.assistant h5.chat-h, .bubble.assistant h6.chat-h { font-size: 1em; }
  .bubble.assistant code { background: var(--surface-sunken); padding: 1px 5px; border-radius: 5px; font-size: .9em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chat-code { background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; overflow-x: auto; font-size: var(--fs-sm); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.5; white-space: pre-wrap; margin: 4px 0; }

  /* 工具卡：骨架(进行中) / 已填充 / 错误 三态 */
  .tool-card { background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--accent-2); border-radius: var(--radius-sm); padding: 10px 14px; max-width: 88%; box-shadow: var(--shadow); }
  .tool-card.pending { opacity: .9; }
  .tool-card.error { border-left-color: var(--danger); background: var(--danger-soft); }
  .tool-card .tool-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-sm); }
  .tool-card .tool-name { font-weight: 600; color: var(--accent-2); }
  .tool-card.error .tool-name { color: var(--danger); }
  .tool-card .tool-args { color: var(--muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; word-break: break-all; }
  .tool-card .tool-body { margin-top: 8px; }
  .tool-row { padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: var(--fs-sm); line-height: 1.55; }
  .tool-row:last-child { border-bottom: none; }
  .tool-empty { color: var(--muted); font-size: var(--fs-sm); padding: 4px 0; }

  /* 写操作确认卡：agent 提议改记忆/话题/待办 → old→new diff + 理由 + 确认/放弃。
     左边框用暖橙（待确认）；确认后转绿、放弃/过期转灰。沿用卡片/徽标/CSS 变量。 */
  .confirm-card { background: var(--surface); border: 1px solid var(--border-strong); border-left: 3px solid var(--warn); border-radius: var(--radius-sm); padding: 12px 14px; max-width: 88%; box-shadow: var(--shadow); }
  .confirm-card.applied { border-left-color: var(--ok); }
  .confirm-card.dismissed { border-left-color: var(--muted); opacity: .82; }
  .confirm-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .confirm-title { font-weight: 700; font-size: var(--fs-sm); color: var(--text); }
  .confirm-context { margin-top: 6px; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); word-break: break-word; }
  .confirm-effect { margin-top: 8px; font-size: var(--fs-sm); color: var(--text-2); line-height: 1.55; word-break: break-word; }
  .confirm-body { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .confirm-row { font-size: var(--fs-sm); line-height: 1.5; display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: baseline; }
  .confirm-field { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); flex-shrink: 0; }
  .confirm-old { color: var(--muted); text-decoration: line-through; word-break: break-word; }
  .confirm-arrow { color: var(--accent); font-weight: 700; }
  .confirm-new { color: var(--text); font-weight: 500; word-break: break-word; }
  .confirm-rationale { margin-top: 8px; font-size: var(--fs-sm); color: var(--text-2); background: var(--surface-sunken); border-radius: var(--radius-sm); padding: 7px 10px; line-height: 1.5; word-break: break-word; }
  .confirm-error { margin-top: 8px; font-size: var(--fs-sm); color: var(--danger); word-break: break-word; }
  .confirm-actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; }

  /* 「正在思考」指示 */
  .agent-typing { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: var(--fs-sm); padding: 2px 2px; }

  /* 思考过程折叠块：把一轮的思考(reasoning)+工具调用收进可折叠块，默认进行中展开、结束折叠 */
  .agent-turn { display: flex; flex-direction: column; gap: 10px; }
  .think-block { align-self: stretch; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-sunken); overflow: hidden; }
  .think-block.running { border-color: var(--accent-2); }
  .think-head { display: flex; align-items: center; gap: 7px; padding: 7px 12px; cursor: pointer; font-size: var(--fs-sm); color: var(--text-2); user-select: none; }
  .think-head:hover { background: var(--surface-2); }
  .think-caret { font-size: 10px; width: 10px; color: var(--muted); flex-shrink: 0; }
  .think-label { font-weight: 600; }
  .think-time { color: var(--muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
  .think-block.running .think-time { color: var(--accent-2); font-weight: 600; }
  .think-count { color: var(--muted); font-size: var(--fs-xs); margin-left: auto; }
  .think-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); }
  /* 折叠块内的工具卡/确认卡占满块宽，去掉左对齐留白 */
  .think-body .chat-msg.assistant { justify-content: stretch; }
  .think-body .tool-card, .think-body .confirm-card { max-width: 100%; }
  /* 思考文本（reasoning）：区别于答复气泡——弱化底色 + 左边线标注 */
  .think-reasoning { font-size: var(--fs-sm); color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent-2); border-radius: 6px; padding: 8px 11px; line-height: 1.6; word-break: break-word; }
  .think-reasoning p { margin: 0 0 6px; }
  .think-reasoning p:last-child { margin-bottom: 0; }
  /* 流式草稿：末尾闪烁光标，提示正在逐字生成 */
  .think-reasoning.streaming::after { content: '▍'; margin-left: 1px; animation: zwblink 1s step-end infinite; color: var(--accent-2); }
  @keyframes zwblink { 50% { opacity: 0; } }

  /* 输入区：贴底，多行自适应 */
  .agent-input { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .agent-input textarea { flex: 1; resize: none; min-height: 44px; max-height: 160px; }

  /* ===== 报告（日报 / 周报 + 话题状态） =====
     沿用卡片/徽标/CSS 变量：日报/周报切换用 .preset 胶囊；进展用进度条；
     数组字段用分节列表（空→「（无）」）；周报趋势用手绘内联 SVG（无图表库）。 */
  .report-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .report-toolbar .spacer { flex: 1; }
  /* 报告主标题（headline / summary，走 renderMarkdown 转义后注入） */
  .report-headline { font-size: var(--fs-lg); font-weight: 700; line-height: 1.5; }
  .report-headline p { margin: 0 0 6px; }
  .report-headline p:last-child { margin-bottom: 0; }
  /* 分节：小标题 + 列表；空数组回退「（无）」 */
  .report-sec { margin-top: 14px; }
  .report-sec-title { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  /* 报告漫画图：自适应宽度、圆角+阴影（复用主题变量），懒加载 */
  .comic-img { max-width: 100%; height: auto; border-radius: var(--radius); box-shadow: var(--shadow); display: block; margin-top: 8px; }
  .report-ul { margin: 0; padding-left: 20px; }
  .report-ul li { margin: 3px 0; line-height: 1.6; }
  /* 进度条（0..1）：概略进展 / 按话题进展 */
  .progress-row { display: flex; align-items: center; gap: 10px; margin: 4px 0 2px; }
  .progress-track { flex: 1; height: 8px; background: var(--surface-sunken); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .progress-pct { font-size: var(--fs-sm); font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
  /* 风险严重度徽标（复用 .badge 基类） */
  .badge.sev-high { background: var(--danger-soft); color: var(--danger); }
  .badge.sev-medium { background: var(--warn-soft); color: var(--warn); }
  .badge.sev-low { background: var(--surface-sunken); color: var(--muted); }
  .risk-item { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .risk-item .risk-desc { flex: 1; min-width: 0; }
  /* 周报「按话题」块 */
  .bytopic { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin: 8px 0; background: var(--surface-2); }
  .bytopic-name { font-weight: 600; margin-bottom: 2px; }
  /* 手绘趋势图（inline SVG，折线 + 圆点 + 基线 + 轴标签，品牌靛蓝） */
  .trend-chart { margin: 10px 0 4px; }
  .trend-metric { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); margin-bottom: 2px; }
  .trend-chart svg { width: 100%; height: auto; display: block; }
  .trend-chart .axis { stroke: var(--border-strong); stroke-width: 1; }
  .trend-chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .trend-chart .dot { fill: var(--accent); }
  .trend-chart .lbl { fill: var(--muted); font-size: 10px; }
  .trend-chart .val { fill: var(--text-2); font-size: 9px; }
  /* 话题分布迷你条形（日报） */
  .mini-bar-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
</style>
</head>
<body>
<div id="app">
  <!-- toast 置于登录门之外：登录页/主界面均可显示（登录错误另用行内 loginError） -->
  <div v-if="toast" class="toast">{{ toast }}</div>

  <!-- ============ 登录门（cookie + session 鉴权） ============ -->
  <!-- authed 三态：null=校验登录态中 / false=登录页 / true=主界面。见 app.js checkAuth + api() 401 拦截。 -->
  <!-- 校验中占位 -->
  <div class="wrap" v-if="authed===null" style="text-align:center; padding-top:64px">
    <span class="spinner"></span> <span class="muted">加载中…</span>
  </div>

  <!-- 登录页（未登录 / 会话过期）：用户名 + 密码，全部 {{ }} 自动转义渲染，密码框 type=password，无富文本注入 -->
  <div class="wrap" v-if="authed===false" style="max-width:380px; padding-top:56px">
    <div class="brand" style="display:block; text-align:center; padding:0 0 20px; font-size:var(--fs-xl)">知微</div>
    <div class="card">
      <form @submit.prevent="submitLogin">
        <label class="field-label" for="login-user">用户名</label>
        <input id="login-user" class="txt" v-model="loginForm.username" autocomplete="username"
               placeholder="用户名" :disabled="loggingIn" style="margin-bottom:12px">
        <label class="field-label" for="login-pass">密码</label>
        <input id="login-pass" class="txt" type="password" v-model="loginForm.password" autocomplete="current-password"
               placeholder="密码" :disabled="loggingIn" style="margin-bottom:14px">
        <div v-if="loginError" class="muted" style="color:var(--danger); margin-bottom:12px">{{ loginError }}</div>
        <button class="btn primary" type="submit" style="width:100%; justify-content:center"
                :disabled="loggingIn || !loginForm.username.trim() || !loginForm.password">
          <span v-if="loggingIn" class="spinner"></span>{{ loggingIn ? '登录中…' : '登录' }}
        </button>
      </form>
    </div>
  </div>

  <!-- ============ 主界面（已登录） ============ -->
  <template v-if="authed===true">
  <div class="tabs">
    <span class="brand">知微</span>
    <button :class="{active: tab==='timeline'}" @click="switchTab('timeline')">时间线</button>
    <button :class="{active: tab==='agent'}" @click="switchTab('agent')">问知微</button>
    <button :class="{active: tab==='reports'}" @click="switchTab('reports')">报告</button>
    <button :class="{active: tab==='record'}" @click="switchTab('record')">录音</button>
    <button :class="{active: tab==='voiceprint'}" @click="switchTab('voiceprint')">声纹</button>
    <button :class="{active: tab==='persons'}" @click="switchTab('persons')">人物</button>
    <button :class="{active: tab==='topics'}" @click="switchTab('topics')">主题</button>
    <button :class="{active: tab==='memories'}" @click="switchTab('memories')">记忆</button>
    <button :class="{active: tab==='todos'}" @click="switchTab('todos')">待办</button>
    <button :class="{active: tab==='settings'}" @click="switchTab('settings')">设置</button>
    <!-- 右侧：当前用户 + 登出（spacer 撑开） -->
    <span style="flex:1"></span>
    <span v-if="currentUser" class="muted" style="padding:0 8px; white-space:nowrap">{{ currentUser.display_name || currentUser.username }}</span>
    <button class="btn ghost" @click="logout" title="退出登录">登出</button>
  </div>


  <!-- ============ 时间线 ============ -->
  <div class="wrap wrap-lg" v-if="tab==='timeline'">
    <!-- 工具栏：搜索 + 日期范围筛选 -->
    <div class="toolbar">
      <input class="txt" v-model="tlSearch" placeholder="搜索转写内容 / 文件名…">
      <input type="date" class="mini" v-model="tlDateFrom" title="起始日期" @change="tlPreset=''">
      <input type="date" class="mini" v-model="tlDateTo" title="截止日期" @change="tlPreset=''">
      <button v-if="tlSearch || tlDateFrom || tlDateTo || tlPreset" class="btn ghost" @click="clearTlFilter">清除</button>
      <div class="spacer"></div>
      <span class="muted">{{ filteredSessions.length }} 条</span>
    </div>
    <!-- 时间快捷方式：点即设置日期范围，手动改日期会取消激活 -->
    <div class="preset-row">
      <button class="preset" :class="{active: tlPreset==='1d'}" @click="applyPreset('1d')">最近1天</button>
      <button class="preset" :class="{active: tlPreset==='2d'}" @click="applyPreset('2d')">最近2天</button>
      <button class="preset" :class="{active: tlPreset==='3d'}" @click="applyPreset('3d')">最近3天</button>
      <button class="preset" :class="{active: tlPreset==='7d'}" @click="applyPreset('7d')">最近7天</button>
      <button class="preset" :class="{active: tlPreset==='30d'}" @click="applyPreset('30d')">最近30天</button>
      <button class="preset" :class="{active: tlPreset==='week'}" @click="applyPreset('week')">本周</button>
      <button class="preset" :class="{active: tlPreset==='lastweek'}" @click="applyPreset('lastweek')">上周</button>
      <button class="preset" :class="{active: tlPreset==='month'}" @click="applyPreset('month')">本月</button>
    </div>

    <div v-if="!sessions.length" class="card empty">还没有记录。去「录音」页上传或录一段吧。</div>
    <div v-if="sessions.length && !filteredSessions.length" class="card empty">没有匹配的记录。</div>

    <div v-for="g in sessionsByDay" :key="g.day">
      <div class="day-group-title">{{ g.label }} <span class="muted">· {{ g.items.length }} 条</span></div>
      <div v-for="s in g.items" :key="s.id">
        <!-- 会话卡片：默认显 ASR 预览，空才显文件名 -->
        <div class="card clickable" @click="toggleSession(s.id)">
          <div class="kv">
            <div style="min-width:0">
              <b v-if="s.asr_preview" style="word-break:break-word">{{ s.asr_preview }}</b>
              <span v-else class="muted">（暂无转写内容）</span>
              <div class="muted">
                {{ fmtTime(s.created_at) }} · {{ s.source === 'web_record' ? '录音' : '上传' }}
                <template v-if="s.memory_count"> · {{ s.memory_count }} 条记忆</template>
                <template v-if="s.todo_count"> · {{ s.todo_count }} 个待办</template>
              </div>
              <!-- 整段声纹相似 top-3 + 判定（列表级，2026-08-26）：
                   整段只有 1 个 ASR 说话人 → 用整段（全部段向量均值）比对；
                   多人 → 用时长最长的一段比对（最能代表主要说话人）。
                   判定两级规则：top1≥0.8 强命中 / ≥0.72 且领先第二名 ≥0.06 弱命中。
                   存量会话（逐段向量落库前处理）无此行 -->
              <div v-if="s.voice_top && (s.voice_top.matches||[]).length" class="muted"
                   style="font-size:var(--fs-xs); margin-top:2px; display:flex; gap:5px; flex-wrap:wrap; align-items:center"
                   :title="'整段声纹与声纹库的相似度 top-3（' + (s.voice_top.basis === 'whole' ? '单人录音：整段音频比对' : '多人录音：时长最长的一段比对') + '）。判定：top1≥0.8，或 ≥0.72 且领先第二名 ≥0.06'">
                <span>🎤 声纹{{ s.voice_top.basis === 'whole' ? '(整段)' : '(最长段)' }} ≈</span>
                <span v-for="(m, mi) in s.voice_top.matches" :key="m.speaker_id"
                      :style="(s.voice_top.matched && mi === 0) ? { color: 'var(--accent)', fontWeight: 600 } : {}">
                  {{ mi > 0 ? '·' : '' }} {{ m.name }} {{ m.similarity.toFixed(2) }}
                </span>
                <span v-if="s.voice_top.matched" :style="{ color: 'var(--ok)', fontWeight: 600 }"
                      title="三级规则判定命中：这个人">→ {{ s.voice_top.speaker_name }}{{ s.voice_top.rule === 'gap' ? '(弱)' : s.voice_top.rule === 'loose' ? '(宽)' : '' }}</span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:6px; flex-shrink:0; flex-wrap:wrap" @click.stop>
              <span v-if="!reextractingIds.has(s.id) && !reidentifyingIds.has(s.id)" class="badge" :class="s.job_status || s.status">{{ statusText(s.job_status, s.job_stage) }}</span>
              <span v-else-if="reextractingIds.has(s.id)" class="badge running"><span class="spinner"></span> 重新提取中</span>
              <span v-else class="badge running"><span class="spinner"></span> 重新识别中</span>
              <button v-if="reidentifyConfirmId !== s.id && reextractConfirmId !== s.id && deletingSessionId !== s.id && !reextractingIds.has(s.id) && !reidentifyingIds.has(s.id)" class="btn mini" @click="askReidentify(s)" title="清空说话人归属，按最新声纹库重新匹配（会覆盖手动换人）">重新识别</button>
              <button v-if="reidentifyConfirmId === s.id" class="btn warn" @click="confirmReidentify(s)">确认重识别?</button>
              <button v-if="reidentifyConfirmId === s.id" class="btn ghost" @click="cancelReidentify()">取消</button>
              <button v-if="reidentifyConfirmId !== s.id && reextractConfirmId !== s.id && deletingSessionId !== s.id && !reextractingIds.has(s.id) && !reidentifyingIds.has(s.id)" class="btn mini" @click="askReextract(s)">重新提取</button>
              <button v-if="reextractConfirmId === s.id" class="btn warn" @click="confirmReextract(s)">确认重提取?</button>
              <button v-if="reextractConfirmId === s.id" class="btn ghost" @click="cancelReextract()">取消</button>
              <button v-if="reidentifyConfirmId !== s.id && deletingSessionId !== s.id && reextractConfirmId !== s.id && !reextractingIds.has(s.id) && !reidentifyingIds.has(s.id)" class="btn mini" @click="askDeleteSession(s)">删除</button>
              <button v-if="deletingSessionId === s.id" class="btn danger" @click="confirmDeleteSession(s)">确认删除?</button>
              <button v-if="deletingSessionId === s.id" class="btn ghost" @click="cancelDeleteSession()">取消</button>
            </div>
          </div>
        </div>

        <!-- 就地展开的转写详情 -->
        <div v-if="expandedId===s.id" class="card detail" style="margin-top:-2px">
          <audio ref="sessionAudioEl" :src="audioUrl(s.id)" controls preload="none" style="width:100%; margin:6px 0 10px" @timeupdate="onTimelineAudioTimeUpdate"></audio>
          <!-- 声学环境徽章（audioscene stage 产出；有值才显）：场景/背景音/天气/整体氛围 -->
          <div v-if="detail && (detail.acoustic_scene || (envSounds(detail.background_sounds).length) || detail.overall_mood)" class="agent-env-bar" style="margin-bottom:8px">
            <span v-if="detail.acoustic_scene" class="chip chip-ro">📍 {{ detail.acoustic_scene }}</span>
            <span v-for="(bg, bi) in envSounds(detail.background_sounds)" :key="'bg'+bi" class="chip chip-ro">🔊 {{ bg }}</span>
            <span v-if="detail.weather_cues && detail.weather_cues !== '无'" class="chip chip-ro">🌦 {{ detail.weather_cues }}</span>
            <span v-if="detail.overall_mood" class="chip chip-ro" :title="detail.overall_mood">💭 {{ detail.overall_mood }}</span>
          </div>
          <!-- 说话人在场情绪（audioscene stage 落库；按 speaker_label 归属）：emotion chip，hover 显微情绪/精神状态/置信 -->
          <div v-if="detail && detail.speaker_states && detail.speaker_states.length" style="margin-bottom:8px">
            <span class="muted" style="font-size:var(--fs-xs); margin-right:6px">在场情绪:</span>
            <span v-for="st in detail.speaker_states" :key="'es'+st.id" class="chip chip-ro" style="cursor:help"
                  :title="'微情绪: ' + (st.micro_emotion||'—') + ' / 状态: ' + (st.mental_state||'—') + ' / 置信: ' + Math.round((st.confidence||0)*100) + '%'">
              😐 {{ st.speaker_name }}: {{ st.emotion }}
            </span>
          </div>
          <!-- 说话人面板：chip 可点=按该说话人过滤转写段；✎ 改名，✕ 删除；「+ 新加说话人」开录入表单 -->
          <div class="speaker-row" style="margin:6px 0 10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center">
            <span class="muted" style="margin-right:4px">说话人</span>
            <span v-for="(sp, i) in detail.speakers" :key="sp.speaker_id"
                  class="chip" :style="{background: speakerColor(i).bg, color: speakerColor(i).fg}"
                  style="cursor:pointer" @click="toggleSpeakerFilter(sp.speaker_id)"
                  :title="sp.source==='auto' ? '自动登记' : '手动录入'">
              {{ sp.name }}
              <button class="chip-x" @click.stop="startRenameSpeaker(sp)" title="改名">✎</button>
              <button class="chip-x" @click.stop="startSwitchSpeaker(sp)" title="切换声纹：本会话该说话人的全部段一键改判给另一声纹">⇄</button>
              <button class="chip-x" @click.stop="askDeleteSpeaker(sp)" title="删除">✕</button>
            </span>
            <label class="chip-add" v-if="!enrollOpen" @click="openEnroll">+ 新加说话人</label>
            <span v-if="speakerFilter" class="chip" style="cursor:pointer; opacity:.8" @click="speakerFilter=null">显示全部 ✕</span>
          </div>
          <!-- 建议名字：speakername stage 用 LLM 从对话推断的候选（名称+置信度数值，倒排）。
               仅随机名说话人展示；✓ 采纳（改名+清候选）· ✕ 忽略该候选；悬浮看依据。 -->
          <div v-if="(detail.speakers||[]).some(hasNameCandidates)" style="margin:0 0 8px; display:flex; flex-direction:column; gap:4px">
            <div v-for="sp in detail.speakers.filter(hasNameCandidates)" :key="'cand-'+sp.speaker_id"
                 style="display:flex; align-items:center; gap:6px; flex-wrap:wrap">
              <span class="muted" style="font-size:var(--fs-xs)">建议名字（{{ sp.name }}）</span>
              <span v-for="c in sp.name_candidates" :key="c.name" class="chip"
                    style="cursor:default" :title="c.evidence || '无依据记录'">
                {{ c.name }} · {{ c.confidence.toFixed(2) }}
                <button class="chip-x" @click.stop="acceptNameCandidate(sp, c)" title="采纳为正式名">✓</button>
                <button class="chip-x" @click.stop="dismissNameCandidate(sp, c)" title="忽略该候选（下次识别可能再次建议；采纳后不再）">✕</button>
              </span>
            </div>
          </div>
          <!-- 改名行（就地一行输入，回车/保存提交） -->
          <div v-if="renamingSpeaker" class="edit-form" style="margin:0 0 8px">
            <input class="txt inline" v-model="renamingSpeaker.name" @keyup.enter="commitRenameSpeaker">
            <button class="btn primary" style="padding:6px 12px; margin-left:6px" @click="commitRenameSpeaker">改名</button>
            <button class="btn mini" @click="renamingSpeaker=null">取消</button>
          </div>
          <!-- 切换声纹行（就地选择）：识别错时把本会话内该说话人的全部段一键改判给目标声纹 -->
          <div v-if="switchingSpeaker" class="edit-form" style="margin:0 0 8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap">
            <span class="muted" style="font-size:var(--fs-xs)">把「{{ switchingSpeaker.name }}」的 {{ switchSegCount }} 段改判给</span>
            <select class="mini" v-model="switchTarget" title="选择目标声纹">
              <option :value="null" disabled>目标声纹…</option>
              <option v-for="sp in allSpeakers.filter(x => x.id !== switchingSpeaker.id)" :key="sp.id" :value="sp.id">{{ sp.name }}</option>
            </select>
            <button class="btn mini primary" :disabled="!switchTarget" @click="commitSwitchSpeaker()">切换</button>
            <button class="btn mini" @click="cancelSwitchSpeaker()">取消</button>
          </div>
          <!-- 录入表单（名称 + 拖拽语音样本，multipart 上传） -->
          <div class="card sunken" v-if="enrollOpen" style="margin-bottom:10px">
            <div class="kv"><b>录入说话人</b><button class="btn-link" @click="enrollOpen=false">✕</button></div>
            <label class="field-label">名称</label>
            <input class="txt" v-model="enrollForm.name" placeholder="如：张三" style="margin-bottom:8px">
            <label class="field-label">语音样本（拖拽 5-30s 干净人声）</label>
            <div @dragover.prevent @drop.prevent="onEnrollDrop" style="border:2px dashed var(--border-strong); border-radius:9px; padding:18px; margin-bottom:8px; text-align:center; color:var(--muted)">
              {{ enrollForm.file ? enrollForm.file.name : '拖拽 wav/mp3 到此处' }}
            </div>
            <div class="edit-actions">
              <button class="btn primary" :disabled="!enrollForm.name.trim()||!enrollForm.file||enrolling" @click="submitEnroll">
                <span v-if="enrolling" class="spinner"></span>{{ enrolling?'录入中…':'录入' }}
              </button>
              <button class="btn mini" @click="enrollOpen=false">取消</button>
            </div>
          </div>
          <!-- 详情双栏（宽屏）：转写在左（detail-main）；有记忆/待办/整理草稿时
               右栏（detail-aside，sticky）展示提取卡片——不用滚到转写列表底部才能看到 -->
          <div class="detail-cols" :class="{ 'has-aside': detailInsights }">
          <div class="detail-main">
          <div class="kv" style="margin-bottom:6px">
            <b>转写详情</b>
            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap">
              <button v-if="segDirty" class="btn primary" style="padding:6px 14px" @click="saveTranscript(s)">保存转写修改</button>
              <button class="btn-link" @click="toggleRawAsr()" :title="rawAsrView?'收起原始 ASR 视图':'查看 ASR 原始结果（spk 标签 + 时间戳 + 文本）'">{{ rawAsrView ? '收起' : '详细' }}</button>
              <template v-if="!mergeMode">
                <button class="btn-link" @click="enterMergeMode()" title="选择多段拆开的发言合并到同一说话人（纠正 ASR 拆分）">合并</button>
              </template>
              <template v-else>
                <span class="muted">已选 {{ mergeCount }} 段 →</span>
                <select class="mini" v-model="mergeTarget" title="选择归到的目标说话人">
                  <option :value="null" disabled>目标说话人…</option>
                  <option v-for="sp in allSpeakers" :key="sp.id" :value="sp.id">{{ sp.name }}</option>
                </select>
                <button class="btn mini primary" :disabled="mergeCount<2 || !mergeTarget" @click="confirmMerge(s)">确认合并</button>
                <button class="btn mini" @click="cancelMerge()">取消</button>
              </template>
              <button class="btn-link" @click="toggleSession(s.id)">✕ 关闭</button>
            </div>
          </div>
          <div v-if="detail.job && detail.job.status==='failed'" style="margin:8px 0">
            <span class="badge failed">处理失败</span>
            <span class="muted">{{ detail.job.last_error }}</span>
            <button class="btn primary" style="padding:4px 12px" @click="retryJob(detail.job.id)">重跑</button>
          </div>
          <!-- 转写段：正常视图(可编辑/换人) vs 原始 ASR 视图(只读，spk 标签+时间戳+文本，排查 diarization 拆分) -->
          <template v-if="!rawAsrView">
          <div v-for="(sg, i) in detail.segments" :key="i" class="seg" v-show="!speakerFilter || sg.speaker_id===speakerFilter">
            <input v-if="mergeMode" type="checkbox" :checked="!!mergeSelected[sg.id]" @change="toggleMergeSelect(sg)" style="margin-top:5px; flex-shrink:0" title="选择此段参与合并">
            <select class="sp" :class="spClass(sg.speaker)" :style="{background: segSpeakerBg(sg)}"
                    @change="reassignSegment(sg, $event.target.value); $event.target.value=sg.speaker_id||''"
                    style="border:none; cursor:pointer" title="点击可改判此段说话人">
              <!-- 首项 = 当前说话人（未解析段显示回退名）；名册列表排除当前说话人，避免同一人出现两次 -->
              <option :value="sg.speaker_id || ''">{{ sg.speaker }}</option>
              <option v-for="sp in allSpeakers.filter(x => x.id !== sg.speaker_id)" :key="sp.id" :value="sp.id">{{ sp.name }}</option>
              <option value="__new">+ 新加…</option>
            </select>
            <button class="btn mini seg-play" @click="toggleTimelineSegPlay(sg)" style="padding:2px 8px; flex-shrink:0" :title="tlPlayingSegId===sg.id?'播放中，点暂停':'播放此段音频'">{{ tlPlayingSegId===sg.id ? '⏸' : '▶' }}</button>
            <button v-if="!mergeMode && segEnrollId!==sg.id" class="btn mini" :disabled="!canEnrollSeg(sg)" @click="startSegEnroll(sg)" style="padding:2px 8px; flex-shrink:0" :title="canEnrollSeg(sg) ? '用此段音频录入声纹' : ('时长 ' + (segDurMs(sg)/1000).toFixed(1) + 's 不足，至少需 ' + (MIN_ENROLL_MS/1000) + 's')">录入</button>
            <div class="seg-text">
              <div v-if="segEnrollId===sg.id" class="edit-form" style="margin:0">
                <input class="txt inline" v-model="segEnrollName" placeholder="说话人名（必填）" @keyup.enter="confirmSegEnroll(s, sg)" @keyup.esc="cancelSegEnroll()">
                <button class="btn mini" @click="confirmSegEnroll(s, sg)">录入</button>
                <button class="btn mini" @click="cancelSegEnroll()">取消</button>
              </div>
              <div v-else-if="!segEditing(sg)" class="editable" @click="startEditSeg(sg)" title="点击编辑转写文本">{{ sg.text }}<span class="hint">✎ 编辑</span></div>
              <div v-else class="edit-form" style="margin:0">
                <textarea class="txt seg-edit" v-model="segDraft[sg.id]" rows="2"
                          @keydown.meta.enter="saveSegEdit(s, sg)" @keydown.ctrl.enter="saveSegEdit(s, sg)"></textarea>
                <div class="edit-actions">
                  <button class="btn mini primary" @click="saveSegEdit(s, sg)" title="保存此段（⌘/Ctrl+Enter）">保存</button>
                  <button class="btn mini" @click="cancelEditSeg(sg)">取消</button>
                </div>
              </div>
              <!-- 段级声纹相似度 top-3（该段音频的向量 vs 全库，含归属者）：一句话可能混
                   多个人——top-1 不是归属说话人（或他人 ≥0.72）时该段可能被 ASR 切错/归错，
                   可用段首下拉换人或说话人 chip 的 ⇄ 批量切换。存量会话无逐段向量则不显示；
                   「已修改」徽章贴在本行末尾（声纹自动纠正标记：幽灵历史声纹改判 或 过短噪声段并入），无相似度数据时单独成行。 -->
              <div v-if="(sg.voice_matches||[]).length || sg.corrected_reason || sg.corrected_from" class="muted" style="font-size:var(--fs-xs); margin-top:2px; display:flex; gap:5px; flex-wrap:wrap; align-items:center"
                   :title="(sg.voice_matches||[]).length ? '该段音频与声纹库的相似度 top-3。若 top-1 不是本段归属的说话人，说明这句可能被切错/归错' : ((sg.entity_edits||[]).length ? '实体纠错：专有名词已按实体库自动纠正（对照见下方删除线）' : (sg.corrected_reason === 'short' ? '过短段自动并入最近说话人（声纹自动纠正）' : (sg.corrected_from_name ? ('原判定：' + sg.corrected_from_name + '（声纹自动纠正）') : '声纹自动纠正（原说话人已不可用）')))">
                <template v-if="(sg.voice_matches||[]).length">
                  <span>时长 {{ (segDurMs(sg)/1000).toFixed(2) }} s ·</span>
                  <span>声纹 ≈</span>
                  <span v-for="(m, mi) in sg.voice_matches" :key="m.speaker_id"
                        :style="(m.similarity >= 0.72 && m.speaker_id !== sg.speaker_id) ? { color: 'var(--accent-2)', fontWeight: 600 } : {}"
                        :title="m.speaker_id === sg.speaker_id ? '本段归属的说话人' : (m.similarity >= 0.72 ? '与他人相似度 ≥ 0.72：这句可能属于此人，可换人/切换声纹' : '')">
                    {{ mi > 0 ? '·' : '' }} {{ m.name }} {{ m.similarity.toFixed(2) }}
                  </span>
                </template>
                <span v-if="sg.corrected_reason || sg.corrected_from" class="corrected-badge"
                      :title="(sg.entity_edits||[]).length ? '实体纠错：专有名词已按实体库自动纠正（对照见下方删除线）' : (sg.corrected_reason === 'short' ? '过短段自动并入最近说话人（声纹自动纠正）' : (sg.corrected_from_name ? ('原判定：' + sg.corrected_from_name + '（声纹自动纠正）') : '声纹自动纠正（原说话人已不可用）'))">已修改</span>
                <!-- 实体纠错对照：原文(删除线) → 纠正后（corrected_reason='entity' 才有 entity_edits） -->
                <template v-if="(sg.entity_edits||[]).length">
                  <span v-for="(ed, ei) in sg.entity_edits" :key="ei"
                        :title="'纠错依据：' + (ed.reason || '发音相近') + '（置信度 ' + (ed.confidence || 0).toFixed(2) + '）'"
                        style="margin-left:4px">
                    <s style="opacity:.55">{{ ed.orig }}</s> → <b>{{ ed.corrected }}</b>
                  </span>
                </template>
              </div>
            </div>
          </div>
          <div v-if="segDirty" class="muted" style="margin-top:4px">有未保存的转写修改，点上方「保存转写修改」生效后即可「重新提取」。</div>
          </template>
          <template v-else>
          <div class="muted" style="margin:4px 0 6px; font-size:var(--fs-xs)">原始 ASR 结果：spk 标签为模型/接口原始输出，同人可能被拆成 spk0/spk1（同一人跨录音靠声纹 1:N 识别归并；本录音内误拆可用上方「合并」按钮手动合并）</div>
          <div v-for="(sg, i) in detail.segments" :key="'r'+i" class="seg raw-asr">
            <span class="raw-spk">spk{{ sg.speaker_label || '—' }}</span>
            <span class="raw-time">{{ fmtSec(sg.start_ms) }} – {{ fmtSec(sg.end_ms) }}</span>
            <span class="raw-text">{{ sg.text }}</span>
          </div>
          </template>
          </div><!-- /detail-main -->
          <!-- 右栏：提取的记忆 / 记忆整理草稿 / 待办。detailInsights=false 时整栏不渲染，
               detail-cols 退化为单列全宽（转写不被压缩） -->
          <div class="detail-aside" v-if="detailInsights">
          <!-- memory 卡片 -->
          <template v-if="detail.memories && detail.memories.length">
            <div class="kv">
              <div class="todo-group-title" style="margin:0">提取的记忆</div>
              <button class="btn mini" :disabled="memConsolidating" @click="startMemoryConsolidate">
                <span v-if="memConsolidating" class="spinner"></span>{{ memConsolidating ? '整理中…' : '记忆整理' }}
              </button>
            </div>
            <div class="card sunken" v-for="m in detail.memories" :key="m.id">
              <div class="kv">
                <!-- 类型标签 + 标题弹性换行：窄列下长标题整行换行，不再缩进错位 -->
                <div style="min-width:0; display:flex; align-items:flex-start; gap:6px; flex-wrap:wrap">
                  <span class="type-tag" style="margin-right:0" :style="{background: typeMeta(m.type).color}">{{ typeMeta(m.type).label }}</span>
                  <b v-if="!editingMem || editingMem.id !== m.id" class="editable" @click="startEditMemory(m)" title="点击编辑">{{ m.title }}<span class="hint">✎</span></b>
                </div>
                <button v-if="dismissingMemId !== m.id" class="btn ghost" @click="askDismissMem(m)" title="忽略此记忆">✕</button>
                <button v-if="dismissingMemId === m.id" class="btn warn" @click="confirmDismissMem(m, () => reloadSession(detail.value.session.id))">确认忽略?</button>
                <button v-if="dismissingMemId === m.id" class="btn ghost" @click="cancelDismissMem()">取消</button>
              </div>
              <div v-if="editingMem && editingMem.id === m.id" class="edit-form">
                <input class="txt" v-model="editingMem.title" style="margin-bottom:8px">
                <textarea class="txt" v-model="editingMem.content" rows="3"></textarea>
                <div class="edit-actions" style="margin-top:8px">
                  <button class="btn primary" style="padding:6px 14px" @click="saveEditMemory(() => reloadSession(detail.session.id))">保存</button>
                  <button class="btn mini" @click="cancelEditMemory()">取消</button>
                </div>
              </div>
              <div v-else style="margin:6px 0">{{ m.content }}</div>
              <div class="muted">重要度 {{ (m.importance ?? 0).toFixed(1) }} · 置信 {{ (m.confidence ?? 0).toFixed(2) }}<template v-if="m.event_at"> · {{ fmtTime(m.event_at) }}</template></div>
              <div class="topic-row">
                <span v-for="tp in topicChips(m)" :key="tp.id" class="chip">{{ tp.name }}<span v-if="tp.source==='user'" style="opacity:.55; font-size:10px">✎</span><button class="chip-x" @click.stop="removeMemoryTopic(m, tp.id)" title="取消关联">✕</button></span>
                <!-- 关联主题用正常下拉（窄列下比 chip 内嵌 select 清晰） -->
                <select class="mini" style="padding:3px 8px" title="关联主题"
                        @change="if($event.target.value){addMemoryTopic(m,$event.target.value);$event.target.value=''}">
                  <option value="">+ 关联主题</option>
                  <option v-for="t in availableTopics" :key="t.id" :value="t.id">{{ t.name }}</option>
                </select>
              </div>
            </div>
          </template>

          <!-- 记忆整理草稿 -->
          <div class="card" v-if="memoryDraft">
            <div class="todo-group-title">记忆整理提议（编辑后确认）</div>
            <div v-if="!memoryDraft.merges.length && !memoryDraft.adjustments.length" class="muted">暂无可整理项</div>
            <div v-if="memoryDraft.merges.length" class="muted" style="margin-bottom:4px">合并组</div>
            <div v-for="(g, gi) in memoryDraft.merges" :key="'mg'+gi" style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px dashed var(--border)">
              <select class="mini" v-model="g.canonical_id" style="margin-bottom:6px">
                <option v-for="m in g.members" :key="m.id" :value="m.id">保留: {{ m.name }}</option>
              </select>
              <div v-for="m in g.members" :key="m.id" class="muted" style="margin:2px 0">
                <label><input type="checkbox" :checked="m.checked" @change="toggleMemoryMember(g, m.id)"> {{ m.name }}</label>
              </div>
            </div>
            <div v-if="memoryDraft.adjustments.length" class="muted" style="margin-bottom:4px">置信度调整</div>
            <div v-for="(a, ai) in memoryDraft.adjustments" :key="'ma'+ai" class="muted" style="margin:2px 0">
              <label><input type="checkbox" :checked="a.checked" @change="toggleMemoryAdjustment(a)"> {{ a.title }} · {{ a.kind }}<span v-if="a.reason"> — {{ a.reason }}</span></label>
            </div>
            <div class="edit-actions" style="margin-top:8px">
              <button class="btn primary" @click="applyMemoryConsolidation">确认整理</button>
              <button class="btn mini" @click="memoryDraft = null">取消</button>
            </div>
          </div>

          <!-- todo 卡片（只读，操作去待办页） -->
          <template v-if="detail.todos && detail.todos.length">
            <div class="todo-group-title">提取的待办</div>
            <div class="card sunken" v-for="td in detail.todos" :key="td.id">
              <div class="kv">
                <div v-if="!editingTodo || editingTodo.id !== td.id" class="editable" @click="startEditTodo(td)" title="点击编辑">☑️ {{ td.title }}<span class="hint">✎</span></div>
                <div v-else style="min-width:0; flex:1">
                  <input class="txt" v-model="editingTodo.title">
                </div>
                <div style="display:flex; gap:6px; flex-shrink:0">
                  <button v-if="editingTodo && editingTodo.id === td.id" class="btn primary" style="padding:6px 12px" @click="saveEditTodo(() => reloadSession(detail.session.id))">保存</button>
                  <button v-if="editingTodo && editingTodo.id === td.id" class="btn mini" @click="cancelEditTodo()">取消</button>
                  <span v-if="!editingTodo || editingTodo.id !== td.id" class="badge" :class="td.status">
                    {{ todoStatusText(td.status) }}
                  </span>
                  <button v-if="(!editingTodo || editingTodo.id !== td.id) && deletingTodoId !== td.id" class="btn mini" @click="askDeleteTodo(td)">删除</button>
                  <button v-if="deletingTodoId === td.id" class="btn danger" @click="confirmDeleteTodo(td, () => reloadSession(detail.session.id))">确认删除?</button>
                  <button v-if="deletingTodoId === td.id" class="btn ghost" @click="cancelDeleteTodo()">取消</button>
                </div>
              </div>
              <div class="muted" v-if="td.due_at">截止 {{ fmtDue(td.due_at) }} · 到「待办」页处理</div>
            </div>
          </template>

          <!-- 涉及的画像变更（该录音触发的 profile 平面变更，按平面分组；无变更不渲染） -->
          <div v-if="detail && detail.profile_changes && detail.profile_changes.length" style="margin-top:14px">
            <div class="todo-group-title">涉及的画像变更</div>
            <div v-for="(logs, kind) in profileChangeGroups" :key="'pcg'+kind" style="margin-bottom:10px">
              <div class="muted" style="margin:2px 0 4px; font-size:var(--fs-xs)">
                {{ profilePlaneMeta(kind).icon }} {{ profilePlaneMeta(kind).label }}（{{ logs.length }}）
              </div>
              <!-- 方案 C（2026-08-29）：审计快照保留抽取时原文（fmtChangeSummary 显示），
                   人物行另附「现名：X」标注；现名与快照不同时整卡可点击跳人物详情。 -->
              <div class="card sunken" v-for="log in logs" :key="log.id"
                   :style="log.entity_kind === 'person' && log.person_current_name ? 'cursor:pointer; margin-bottom:6px' : 'margin-bottom:6px'"
                   @click="log.entity_kind === 'person' && jumpToPerson(log.person_id)">
                <div style="display:flex; align-items:center; gap:6px">
                  <div style="min-width:0; flex:1; font-size:var(--fs-sm)">{{ fmtChangeSummary(log) }}</div>
                  <span :style="{background:profileChangeAction(log).color, color:'#fff', padding:'1px 7px', borderRadius:'4px', fontSize:'10px', flexShrink:0}">{{ profileChangeAction(log).label }}</span>
                </div>
                <div class="muted" style="font-size:var(--fs-xs); margin-top:3px">
                  {{ log.changed_by === 'llm' ? '🤖 LLM 抽取' : '✋ 手动' }}<template v-if="log.confidence != null"> · 置信 {{ log.confidence.toFixed(2) }}</template> · {{ fmtTime(log.created_at) }}
                  <!-- 现名标注：仅人物行且现名与审计快照原文不同时显示（快照去 JSON 引号后比对） -->
                  <template v-if="log.entity_kind === 'person' && log.person_current_name && snapText(log.new_value) !== log.person_current_name">
                    · 现名：<b style="color:var(--accent)">{{ log.person_current_name }}</b>
                  </template>
                  <button v-if="profileChangeAction(log).label === '待确认'" class="btn mini" @click.stop="goProfilePending" style="margin-left:6px">去确认</button>
                </div>
              </div>
            </div>
          </div>

          </div><!-- /detail-aside -->
          </div><!-- /detail-cols -->
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 问知微（流式对话） ============ -->
  <!-- 左：对话列表；右：消息流 + 底部输入。WS 流式帧 → 气泡/工具卡（见 app.js 问知微区）。 -->
  <div class="wrap wrap-lg" v-if="tab==='agent'">
    <div class="agent-shell">
      <!-- 左侧：会话列表 -->
      <div class="agent-convos">
        <button class="btn primary" style="width:100%; justify-content:center; margin-bottom:10px" @click="newAgentConversation">＋ 新对话</button>
        <div v-if="!agentConversations.length" class="muted" style="padding:8px 4px; font-size:var(--fs-sm)">还没有对话，点上方「新对话」开始。</div>
        <div v-for="c in agentConversations" :key="c.id" class="agent-convo-item" :class="{active: c.id===agentConvId}" @click="selectAgentConversation(c)">
          <!-- 编辑标题态：行内 input -->
          <template v-if="agentEditConvId === c.id">
            <input class="agent-convo-edit" v-model="agentEditTitle"
                   @click.stop
                   @keyup.enter="saveAgentTitle(c)"
                   @keyup.esc="cancelEditConv"
                   @blur="saveAgentTitle(c)" />
          </template>
          <!-- 删除待确认态：就地确认（不弹原生 confirm），确认/取消常显 -->
          <template v-else-if="deletingConvId === c.id">
            <b>{{ c.title || '新对话' }}</b>
            <span class="agent-convo-meta agent-convo-confirm" @click.stop>
              <span class="danger-text">删除此对话?</span>
              <span class="agent-convo-ops-confirm">
                <button class="btn xs danger" @click="deleteAgentConversation(c)">确认删除</button>
                <button class="btn xs" @click="cancelDeleteConv()">取消</button>
              </span>
            </span>
          </template>
          <!-- 常态：标题 + 时间 + hover 显的编辑/删除 -->
          <template v-else>
            <b>{{ c.title || '新对话' }}</b>
            <span class="muted agent-convo-meta">
              <span>{{ fmtTime(c.last_active_at) }}</span>
              <span class="agent-convo-ops" @click.stop>
                <button class="btn xs" title="编辑标题" @click="startEditConv(c)">✏️</button>
                <button class="btn xs danger" title="删除会话" @click="askDeleteConv(c)">🗑</button>
              </span>
            </span>
          </template>
        </div>
      </div>

      <!-- 右侧：消息流 + 输入 -->
      <div class="agent-main">
        <div v-if="!agentConvId" class="card empty" style="margin-top:40px">
          选择左侧对话，或点「新对话」，开始向「知微」提问你的记忆、待办与主题。
        </div>
        <template v-else>
          <div class="kv" style="margin-bottom:6px">
            <span class="agent-conn" :style="{color: agentConnected ? 'var(--ok)' : 'var(--muted)'}">● {{ agentConnected ? '已连接' : '连接中…' }}</span>
          </div>
          <div class="agent-stream" ref="agentStreamEl">
            <div v-if="agentLoading" class="muted" style="text-align:center; padding:20px"><span class="spinner"></span> 加载历史…</div>
            <div v-if="!agentLoading && !agentMessages.length" class="empty">发条消息开始对话吧。试试：「我这周有哪些待办？」</div>

            <div v-for="(turn, ti) in agentTurns" :key="ti" class="agent-turn">
              <!-- 用户气泡 -->
              <div v-if="turn.userText" class="chat-msg user">
                <div class="bubble user"><span style="white-space:pre-wrap">{{ turn.userText }}</span></div>
              </div>
              <!-- 思考过程折叠块：有过程项(思考/工具) 或 该轮进行中时显示；默认进行中/有待确认提议时展开，否则折叠 -->
              <div v-if="turn.thinking.length || turnRunning(ti)" class="think-block" :class="{running: turnRunning(ti), open: isTurnOpen(ti)}">
                <div class="think-head" @click="toggleTurn(ti)">
                  <span class="think-caret">{{ isTurnOpen(ti) ? '▾' : '▸' }}</span>
                  <span v-if="turnRunning(ti)" class="spinner"></span>
                  <span class="think-label">💭 思考过程</span>
                  <span class="think-time">{{ turnRunning(ti) ? ('思考中 · ' + fmtDur(turnDuration(ti))) : ('用时 ' + fmtDur(turnDuration(ti))) }}</span>
                  <span v-if="turn.thinking.length" class="think-count">· {{ turn.thinking.length }} 步</span>
                </div>
                <div v-show="isTurnOpen(ti)" class="think-body">
                  <template v-for="(m, mi) in turn.thinking" :key="mi">
                    <!-- 模型思考内容（reasoning）：折叠块内左对齐文本 -->
                    <div v-if="m.kind==='reasoning'" class="think-reasoning" v-html="renderMarkdown(m.content)"></div>
                    <!-- 工具卡：未出结果=骨架「进行中」；出结果按工具类型渲染；is_error 走错误样式。
                         若结果是写-提议（propose_*）则改渲染「确认卡」（见下 m.proposal 分支）。 -->
                    <div v-else-if="m.kind==='tool'" class="chat-msg assistant">
                <!-- 思考块内只放读工具卡；写-提议确认卡已移到答复区 turn.proposals 显眼展示 -->
                <div class="tool-card" :class="{error: m.result && m.result.is_error, pending: !m.result}">
                  <div class="tool-head">
                    <span v-if="!m.result" class="spinner"></span>
                    <span class="tool-name">🔧 {{ m.label }}</span>
                    <span v-if="m.argsSummary" class="tool-args">{{ m.argsSummary }}</span>
                    <span v-if="!m.result" class="muted" style="font-size:var(--fs-xs)">进行中…</span>
                  </div>
                  <div class="tool-body" v-if="m.result">
                    <!-- 错误结果 -->
                    <div v-if="m.result.is_error" style="white-space:pre-wrap; color:var(--danger)">{{ m.result.text }}</div>
                    <!-- search_memory：记忆列表 -->
                    <template v-else-if="m.base==='search_memory' && Array.isArray(m.parsed)">
                      <div v-if="!m.parsed.length" class="tool-empty">没有匹配的记忆</div>
                      <div v-for="(x, xi) in m.parsed" :key="xi" class="tool-row">
                        <div><span class="type-tag" :style="{background: typeMeta(x.type).color}">{{ typeMeta(x.type).label }}</span><b>{{ x.title }}</b></div>
                        <div class="muted">{{ x.content }}</div>
                        <div class="muted" style="font-size:var(--fs-xs)">重要度 {{ (x.importance ?? 0).toFixed(1) }}<template v-if="x.event_at"> · {{ fmtTime(x.event_at) }}</template></div>
                      </div>
                    </template>
                    <!-- get_timeline：会话列表(有 session_id) 或 转写分段(有 speaker) -->
                    <template v-else-if="m.base==='get_timeline' && Array.isArray(m.parsed)">
                      <div v-if="!m.parsed.length" class="tool-empty">暂无数据</div>
                      <template v-else-if="m.parsed[0] && m.parsed[0].session_id">
                        <div v-for="(x, xi) in m.parsed" :key="xi" class="tool-row">
                          <div><b>{{ x.filename || '录音' }}</b> <span class="badge" :class="x.status">{{ statusText(x.status) }}</span></div>
                          <div class="muted" style="font-size:var(--fs-xs)">{{ fmtTime(x.created_at) }} · {{ x.source==='web_record' ? '录音' : '上传' }}<template v-if="x.duration_ms"> · {{ (x.duration_ms/1000).toFixed(0) }}s</template></div>
                        </div>
                      </template>
                      <template v-else>
                        <div v-for="(x, xi) in m.parsed" :key="xi" class="tool-row" style="display:flex; gap:8px; align-items:flex-start">
                          <span class="sp sp1">{{ x.speaker }}</span>
                          <span style="flex:1; min-width:0">{{ x.text }}</span>
                        </div>
                      </template>
                    </template>
                    <!-- get_topics：主题列表 -->
                    <template v-else-if="m.base==='get_topics' && Array.isArray(m.parsed)">
                      <div v-if="!m.parsed.length" class="tool-empty">暂无主题</div>
                      <div v-for="(x, xi) in m.parsed" :key="xi" class="tool-row">
                        <b>{{ x.name }}</b>
                        <span v-if="x.status==='suggested'" class="badge suggested">待确认</span>
                        <span class="muted" style="font-size:var(--fs-xs)"> · {{ x.memory_count }} 条记忆 · {{ x.open_todo_count }} 个进行中待办</span>
                      </div>
                    </template>
                    <!-- get_todos：待办列表 -->
                    <template v-else-if="m.base==='get_todos' && Array.isArray(m.parsed)">
                      <div v-if="!m.parsed.length" class="tool-empty">暂无待办</div>
                      <div v-for="(x, xi) in m.parsed" :key="xi" class="tool-row">
                        <span>☑️ {{ x.title }}</span>
                        <span class="badge" :class="x.status">{{ todoStatusText(x.status) }}</span>
                        <span v-if="x.due_at" class="muted" style="font-size:var(--fs-xs)"> · 截止 {{ fmtDue(x.due_at) }}</span>
                        <span v-for="(tp, ti) in (x.topics||[])" :key="ti" class="chip" style="margin-left:4px">{{ tp }}</span>
                      </div>
                    </template>
                    <!-- generate_report / get_topic_status：报告快照 -->
                    <template v-else-if="m.report">
                      <div class="tool-row"><b>{{ m.report.title }}</b><span v-if="m.report.progress!=null" class="muted" style="font-size:var(--fs-xs)"> · 进展 {{ Math.round(m.report.progress*100) }}%</span></div>
                      <div v-for="(sec, si) in m.report.sections" :key="si" class="tool-row">
                        <div class="muted" style="font-weight:600; font-size:var(--fs-xs)">{{ sec.label }}</div>
                        <div v-for="(it, ii) in sec.items" :key="ii" style="font-size:var(--fs-sm)">· {{ it }}</div>
                      </div>
                    </template>
                    <!-- 通用兜底：美化 JSON（文本插值，自动转义） -->
                    <template v-else>
                      <pre class="chat-code">{{ prettyJSON(m.result.text) }}</pre>
                    </template>
                  </div>
                </div>
              </div>
                  </template>
                  <!-- 流式思考草稿（边想边现）：仅当前活轮；权威 reasoning 帧到达后清空 -->
                  <div v-if="turnRunning(ti) && streamDraft.reasoning" class="think-reasoning streaming" v-html="renderMarkdown(streamDraft.reasoning)"></div>
                </div>
              </div>
              <!-- 流式答复草稿（边答边现）：权威 assistant 帧到达后清空 -->
              <div v-if="turnRunning(ti) && streamDraft.answer" class="chat-msg assistant">
                <div class="bubble assistant"><span v-html="renderMarkdown(streamDraft.answer)"></span></div>
              </div>
              <!-- 助手答复气泡（在思考块之外，突出最终答复） -->
              <div v-for="(m, ai) in turn.answers" :key="'a'+ai" class="chat-msg assistant">
                <div class="bubble assistant"><span v-html="renderMarkdown(m.content)"></span></div>
              </div>
              <!-- 写-提议确认卡：移出思考块，答复区显眼展示（需用户确认/放弃，不该被折叠藏起） -->
              <div v-for="(m, pi) in turn.proposals" :key="'p'+pi" class="chat-msg assistant">
                <div class="confirm-card" :class="{applied: m.proposal.status==='applied', dismissed: m.proposal.status==='dismissed' || m.proposal.status==='expired'}">
                  <div class="confirm-head">
                    <span class="confirm-title">✍️ {{ m.pview.title }}</span>
                    <span v-if="m.proposal.status==='applied'" class="badge done">已确认</span>
                    <span v-else-if="m.proposal.status==='dismissed'" class="badge dismissed">已放弃</span>
                    <span v-else-if="m.proposal.status==='expired'" class="badge dismissed">已过期</span>
                    <span v-else class="badge pending">待确认</span>
                  </div>
                  <div v-if="m.pview.showContext" class="confirm-context">「{{ m.pview.contextLabel }}」</div>
                  <div v-if="m.pview.isEffect" class="confirm-effect">{{ m.pview.effect }}</div>
                  <div v-else-if="m.pview.rows.length" class="confirm-body">
                    <div v-for="(row, ri) in m.pview.rows" :key="ri" class="confirm-row">
                      <span class="confirm-field">{{ row.field }}</span>
                      <template v-if="row.hasOld">
                        <span class="confirm-old">{{ row.old || '（空）' }}</span>
                        <span class="confirm-arrow">→</span>
                      </template>
                      <span class="confirm-new">{{ row.new || '（空）' }}</span>
                    </div>
                  </div>
                  <div v-if="m.proposal.rationale" class="confirm-rationale">理由：{{ m.proposal.rationale }}</div>
                  <div v-if="m.proposalError" class="confirm-error">操作失败：{{ m.proposalError }}</div>
                  <div v-if="m.proposal.status==='pending'" class="confirm-actions">
                    <button class="btn primary" style="padding:7px 18px" :disabled="m.proposalBusy" @click="confirmProposal(m)">
                      <span v-if="m.proposalBusy" class="spinner"></span>确认
                    </button>
                    <button class="btn mini" :disabled="m.proposalBusy" @click="dismissProposal(m)">放弃</button>
                  </div>
                </div>
              </div>
            </div>

            <div v-if="agentThinkingGap" class="agent-typing"><span class="spinner"></span> 知微正在思考…</div>
            <div v-if="agentTurnError" class="card" style="margin:0; border-color:var(--danger); background:var(--danger-soft); color:var(--danger)">出错了：{{ agentTurnError }}</div>
          </div>

          <!-- 输入区：Enter 发送，Shift+Enter 换行 -->
          <div class="agent-input">
            <textarea class="txt" v-model="agentInput" rows="1" placeholder="问知微…（Enter 发送，Shift+Enter 换行）"
                      @keydown.enter.exact.prevent="sendAgentMessage"></textarea>
            <!-- 轮次进行中显示「停止」(→ WS {stop:true} 请求优雅中止)，否则显示「发送」；收 turn_end 后 agentTyping 复位自动切回 -->
            <button v-if="agentTyping" class="btn" @click="stopAgentMessage" :disabled="!agentConnected" title="停止本轮回复">停止</button>
            <button v-else class="btn primary" :disabled="!agentInput.trim() || !agentConnected" @click="sendAgentMessage">发送</button>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ============ 设置（知微人设：identity + soul） ============ -->
  <!-- 每轮随对话注入到发给 dsh 的文本前（见 orchestrator.Persona / AssemblePersona）：保存后
       下一条消息即时生效，不重启 dsh。留空则退化为进程级默认 persona。 -->
  <div class="wrap" v-if="tab==='settings'">
    <div class="card">
      <h2 style="margin:0 0 4px">知微人设</h2>
      <div class="muted" style="font-size:var(--fs-sm); margin-bottom:16px">
        配置知微的「身份」与「性格」。保存后 <b>下一条消息即时生效</b>（每轮随对话注入，无需重启）。留空则使用默认人设。
      </div>
      <label style="font-size:var(--fs-sm); font-weight:600">身份设定（identity）</label>
      <div class="muted" style="font-size:var(--fs-xs); margin:2px 0 6px">你是谁、扮演什么角色、职责边界。</div>
      <textarea class="txt" v-model="agentCfgIdentity" rows="4" style="width:100%" placeholder="例：你是「知微」，用户的私人记忆与日程助理，只依据用户的记忆/时间线/待办作答，不编造。"></textarea>

      <label style="font-size:var(--fs-sm); font-weight:600; margin-top:14px; display:block">性格与说话风格（soul）</label>
      <div class="muted" style="font-size:var(--fs-xs); margin:2px 0 6px">语气、个性、价值观、表达习惯。</div>
      <textarea class="txt" v-model="agentCfgSoul" rows="4" style="width:100%" placeholder="例：温柔、简洁、直接，不说客套话，偶尔一点幽默。"></textarea>

      <div class="edit-actions" style="margin-top:14px; display:flex; gap:10px; align-items:center">
        <button class="btn primary" :disabled="agentCfgSaving" @click="saveAgentConfig">
          <span v-if="agentCfgSaving" class="spinner"></span>保存人设
        </button>
        <span v-if="agentCfgSaved" class="muted" style="font-size:var(--fs-sm); color:var(--ok)">✓ 已保存，下条消息生效</span>
      </div>

      <!-- 进程级 system prompt（只读，不可编辑）：dsh 的 persona 基座 -->
      <div style="margin-top:22px">
        <div class="muted" style="font-size:var(--fs-xs); font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px">进程级 SYSTEM PROMPT（只读）</div>
        <pre class="chat-code">{{ agentCfgSystemPrompt || '（未设置）' }}</pre>
      </div>

      <!-- 整体 prompt 组装（只读）：system 基座 + 每轮注入(人设+owner画像) + 动态检索说明 + 你的问题，方便看全貌 -->
      <div style="margin-top:16px">
        <div class="muted" style="font-size:var(--fs-xs); font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px">整体 PROMPT 组装（只读，看全貌）</div>
        <pre class="chat-code">{{ agentCfgFullPrompt }}</pre>
      </div>
    </div>

    <!-- ============ 专有名词（ASR 实体纠错：设置阈值/开关 + 实体库增删启禁） ============ -->
    <!-- ASR 常把人名/花名/项目代号听错；开启后转写中发音相近片段按实体库自动纠正，纠正处在时间线标注原文对照。
         自动实体每次录音刷新收录（删除后下次回来，想持久停用请禁用）；手动实体可自由增删。 -->
    <div class="card">
      <h2 style="margin:0 0 4px">专有名词</h2>
      <div class="muted" style="font-size:var(--fs-sm); margin-bottom:16px">
        ASR 常把人名/花名/项目代号听错。开启后，转写中发音相近的片段会按下方实体库自动纠正，纠正处会在时间线里标注原文对照。
      </div>
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:600">
          <input type="checkbox" v-model="entCfg.correction_enabled"> 实体纠错
        </label>
        <label style="display:flex; align-items:center; gap:4px; font-size:var(--fs-sm)" title="低于该置信度的纠正建议不落地">
          置信度阈值
          <input class="txt" type="number" v-model.number="entCfg.confidence_threshold" min="0" max="1" step="0.05" style="width:72px">
        </label>
        <button class="btn primary" @click="saveEntitySettings" :disabled="entSaving">{{ entSaving ? '保存中…' : '保存设置' }}</button>
      </div>
      <div class="muted" style="font-size:var(--fs-xs); margin-bottom:12px">
        自动收录（每次录音时刷新）：
        <span v-for="(n, k) in entCfg.counts_by_kind" :key="k" style="margin-right:10px">{{ entKindLabels[k] || k }} {{ n }}</span>
        <span v-if="!Object.keys(entCfg.counts_by_kind||{}).length">（暂无）</span>
      </div>

      <!-- 手动补充 -->
      <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap">
        <input class="txt" v-model="entNewCanonical" placeholder="补充专有名词（内部代号/产品别名等）" style="flex:1; min-width:200px" @keyup.enter="addEntity">
        <input class="txt" v-model="entNewNote" placeholder="备注（可选）" style="width:140px">
        <button class="btn primary" @click="addEntity">添加</button>
      </div>

      <!-- 实体列表（auto+manual，含禁用行） -->
      <div v-for="e in entList" :key="e.id"
           style="display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--border,#eee)">
        <span :class="{ muted: !e.enabled }" :style="e.enabled ? 'font-weight:600' : 'text-decoration:line-through'">{{ e.canonical }}</span>
        <span class="muted" style="font-size:var(--fs-xs)">{{ entKindLabels[e.kind] || e.kind }} · {{ e.source === 'manual' ? '手动' : '自动' }}<template v-if="e.note"> · {{ e.note }}</template></span>
        <span style="flex:1"></span>
        <button class="btn" style="padding:4px 10px; font-size:var(--fs-xs)" @click="toggleEntity(e)" :title="e.enabled ? '禁用（不参与纠错，刷新保留）' : '启用'">{{ e.enabled ? '禁用' : '启用' }}</button>
        <button class="btn" style="padding:4px 10px; font-size:var(--fs-xs)" @click="removeEntity(e)" :title="e.source === 'manual' ? '删除' : '自动实体删除后下次刷新会回来，想持久停用请禁用'">删除</button>
      </div>
      <div v-if="!entList.length" class="muted" style="font-size:var(--fs-xs); padding:6px 0">实体库为空——录一段音频后自动收录，或在上方手动补充。</div>
    </div>

    <!-- ============ MCP 服务（全局管理：手动添加/启禁/删除，保存即时生效） ============ -->
    <div class="card">
      <h2 style="margin:0 0 4px">MCP 服务</h2>
      <div class="muted" style="font-size:var(--fs-sm); margin-bottom:16px">
        管理智微可连接的 MCP 服务（工具来源）。添加/启用/禁用/删除<b>即时生效</b>（热插拔，无需重启）。
        内置「知微内置工具」为 agent 的记忆/画像数据通道，<b>不可删禁</b>。stdio 服务会在服务器上执行所填命令，请谨慎添加。
      </div>

      <!-- 服务列表 -->
      <div style="display:flex; flex-direction:column; gap:8px">
        <div v-for="m in mcpServers" :key="m.id"
             style="display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--border,#ddd); border-radius:8px">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer">
            <input type="checkbox" :checked="m.enabled" :disabled="m.builtin" @change="toggleMCP(m)">
            <span style="font-weight:600">{{ m.display_name || m.server_key }}</span>
          </label>
          <code style="font-size:var(--fs-xs); color:var(--muted,#888)">{{ m.server_key }}</code>
          <span class="muted" style="font-size:var(--fs-xs); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">
            {{ m.transport }} · {{ m.url || m.command || '—' }}
          </span>
