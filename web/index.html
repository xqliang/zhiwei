          <span v-if="m.builtin" class="muted" style="font-size:var(--fs-xs)">内置</span>
          <button v-else class="btn" style="padding:4px 10px; font-size:var(--fs-xs)" @click="deleteMCP(m)">删除</button>
        </div>
      </div>

      <!-- 新增表单 -->
      <div style="margin-top:18px; padding-top:14px; border-top:1px solid var(--border,#eee)">
        <div style="font-size:var(--fs-sm); font-weight:600; margin-bottom:8px">添加 MCP 服务</div>
        <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center">
          <input class="txt" v-model="mcpForm.server_key" placeholder="server_key（字母数字下划线）" style="width:200px">
          <input class="txt" v-model="mcpForm.display_name" placeholder="显示名（可选）" style="width:150px">
          <select class="txt" v-model="mcpForm.transport" style="width:150px">
            <option value="streamable-http">streamable-http</option>
            <option value="stdio">stdio</option>
          </select>
          <input v-if="mcpForm.transport==='streamable-http'" class="txt" v-model="mcpForm.url" placeholder="服务 URL（如 https://host/mcp）" style="flex:1; min-width:240px">
          <template v-else>
            <input class="txt" v-model="mcpForm.command" placeholder="命令（如 node）" style="width:150px">
            <input class="txt" v-model="mcpForm.args" placeholder="参数（空格分隔）" style="flex:1; min-width:200px">
          </template>
          <button class="btn primary" @click="addMCP">添加</button>
        </div>
        <div v-if="mcpErr" class="muted" style="font-size:var(--fs-xs); color:var(--danger,#c33); margin-top:6px">{{ mcpErr }}</div>
      </div>
    </div>

    <!-- ============ 技能 Skills（搜索安装/启禁/删除，落盘热生效） ============ -->
    <div class="card">
      <h2 style="margin:0 0 4px">技能（Skills）</h2>
      <div class="muted" style="font-size:var(--fs-sm); margin-bottom:16px">
        从 skills.sh 搜索安装技能（SKILL.md 指令集），安装/启禁/删除<b>下一轮对话即生效</b>（热加载，无需重启）。
        技能内容会作为指令注入模型，<b>仅安装可信来源</b>。
      </div>

      <!-- 已装列表 -->
      <div style="display:flex; flex-direction:column; gap:8px">
        <div v-for="s in agentSkills" :key="s.id"
             style="display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--border,#ddd); border-radius:8px">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer">
            <input type="checkbox" :checked="s.enabled" @change="toggleSkill(s)">
            <code style="font-weight:600">{{ s.name }}</code>
          </label>
          <span class="muted" style="font-size:var(--fs-xs); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ s.description }}</span>
          <span class="muted" style="font-size:var(--fs-xs)">{{ s.source || 'manual' }}</span>
          <button class="btn" style="padding:4px 10px; font-size:var(--fs-xs)" @click="skillView = (skillView && skillView.id === s.id ? null : s)">查看</button>
          <button class="btn" style="padding:4px 10px; font-size:var(--fs-xs)" @click="deleteSkill(s)">删除</button>
        </div>
        <div v-if="skillView" style="padding:12px; border:1px solid var(--border,#eee); border-radius:8px">
          <div class="muted" style="font-size:var(--fs-xs); margin-bottom:6px">SKILL.md（{{ skillView.name }}）</div>
          <pre class="chat-code" style="max-height:320px; overflow:auto">{{ skillView.content }}</pre>
        </div>
      </div>

      <!-- 搜索安装 -->
      <div style="margin-top:18px; padding-top:14px; border-top:1px solid var(--border,#eee)">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
          <input class="txt" v-model="skillSearchQ" placeholder="搜索技能（如 git、pdf、code-review）" style="flex:1; min-width:220px" @keyup.enter="searchSkills">
          <button class="btn primary" :disabled="skillSearching" @click="searchSkills">{{ skillSearching ? '搜索中…' : '搜索 skills.sh' }}</button>
        </div>
        <div v-if="skillResults.length" style="margin-top:10px; display:flex; flex-direction:column; gap:6px">
          <div v-for="hit in skillResults" :key="hit.id" style="display:flex; align-items:center; gap:10px; font-size:var(--fs-sm)">
            <code>{{ hit.name }}</code>
            <span class="muted" style="font-size:var(--fs-xs); flex:1">{{ hit.id }}</span>
            <span class="muted" style="font-size:var(--fs-xs)">{{ hit.installs }} 次安装</span>
            <button class="btn" style="padding:4px 10px; font-size:var(--fs-xs)" @click="installSkill(hit.id)">安装</button>
          </div>
        </div>
        <div style="margin-top:12px; display:flex; gap:8px; align-items:center">
          <input class="txt" v-model="skillManual" placeholder="手动安装：owner/repo/skill" style="flex:1; min-width:220px">
          <button class="btn" :disabled="!skillManual.trim()" @click="installSkill(skillManual.trim())">安装</button>
        </div>
        <div v-if="skillErr" class="muted" style="font-size:var(--fs-xs); color:var(--danger,#c33); margin-top:6px">{{ skillErr }}</div>
      </div>
    </div>
  </div>

  <!-- ============ 报告（日报/周报 + 话题状态） ============ -->
  <!-- 内容全部来自 LLM：headline/summary 经 renderMarkdown（转义优先）注入；其余字段走 {{ }} 自动转义。
       所有数组字段都对 null/undefined 兜底为 []，空时显示「（无）」。 -->
  <div class="wrap" v-if="tab==='reports'">
    <!-- 工具栏：日报/周报切换 + 日期选择 + 重新生成 -->
    <div class="report-toolbar">
      <button class="preset" :class="{active: reportKind==='daily'}" @click="switchReportKind('daily')">日报</button>
      <button class="preset" :class="{active: reportKind==='weekly'}" @click="switchReportKind('weekly')">周报</button>
      <input v-if="reportKind==='daily'" type="date" class="mini" v-model="reportDate" title="日报日期" @change="loadReport">
      <input v-else type="date" class="mini" v-model="reportWeekStart" title="周报周起始（任填本周任一天，后端归一到周一）" @change="loadReport">
      <div class="spacer"></div>
      <button class="btn mini" :disabled="reportLoading" @click="regenReport" title="强制调用模型重新生成">
        <span v-if="reportLoading" class="spinner"></span>{{ reportLoading ? '生成中…' : '重新生成' }}
      </button>
    </div>

    <!-- 加载骨架（首次生成需调模型，稍候） -->
    <div class="card" v-if="reportLoading && !reportContent">
      <div class="muted" style="margin-bottom:8px"><span class="spinner"></span> 正在加载报告…（若首次生成需调用模型，请稍候）</div>
      <div class="skeleton-line med"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div>
    </div>

    <!-- 生成失败 / 内容为空 → 友好提示 + 重新生成 -->
    <div class="card" v-else-if="reportFailed">
      <div class="kv">
        <div style="min-width:0">
          <b>生成失败，请重试</b>
          <div class="muted" v-if="reportError">{{ reportError }}</div>
          <div class="muted" v-else>报告内容为空或未成功生成。</div>
        </div>
        <button class="btn primary" style="padding:7px 16px" :disabled="reportLoading" @click="regenReport">
          <span v-if="reportLoading" class="spinner"></span>{{ reportLoading ? '生成中…' : '重新生成' }}
        </button>
      </div>
    </div>

    <!-- 报告卡 -->
    <div class="card" v-else-if="reportContent">
      <div class="report-headline" v-html="renderMarkdown(reportContent.headline || '')"></div>

      <!-- ===== 日报 ===== -->
      <template v-if="reportKind==='daily'">
        <report-list label="要点" :items="reportContent.highlights || []"></report-list>
        <report-list label="决定" :items="reportContent.decisions || []"></report-list>
        <report-list label="待办 · 新增" :items="(reportContent.todos || {}).new || []"></report-list>
        <report-list label="待办 · 完成" :items="(reportContent.todos || {}).done || []"></report-list>
        <report-list label="待办 · 未完成" :items="(reportContent.todos || {}).open || []"></report-list>
        <report-list label="洞察" :items="reportContent.insights || []"></report-list>
        <report-list label="明日计划" :items="reportContent.tomorrow || []"></report-list>
        <!-- 话题分布：迷你条形（按当天计数缩放） -->
        <div class="report-sec">
          <div class="report-sec-title">话题分布</div>
          <template v-if="(reportContent.topic_distribution || []).length">
            <div class="mini-bar-row" v-for="(t, ti) in reportContent.topic_distribution" :key="ti">
              <b style="min-width:80px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ t.topic }}</b>
              <div class="progress-track"><div class="progress-fill" :style="{width: Math.max(3, (t.count || 0) / maxCount(reportContent.topic_distribution) * 100) + '%'}"></div></div>
              <span class="progress-pct">{{ t.count || 0 }}</span>
            </div>
          </template>
          <div v-else class="muted">（无）</div>
        </div>
        <!-- ===== 深度字段（Task 5）：叙事 / 规律 / 情绪走向 / 场景分布 ===== -->
        <report-text label="叙事" :text="reportContent.narrative"></report-text>
        <report-list label="规律" :items="reportContent.patterns || []"></report-list>
        <!-- 情绪走向：逐点渲染「时段 情绪（valence±） · 微情绪」 -->
        <div class="report-sec" v-if="reportContent.mood_journey && reportContent.mood_journey.length">
          <div class="report-sec-title">情绪走向</div>
          <ul class="report-ul"><li v-for="(m, i) in reportContent.mood_journey" :key="i">
            {{ m.when }} <b>{{ m.mood }}</b><span v-if="typeof m.valence === 'number'">（{{ m.valence > 0 ? '+' : '' }}{{ m.valence.toFixed(1) }}）</span><span v-if="m.note"> · {{ m.note }}</span>
          </li></ul>
        </div>
        <!-- 场景分布：chip 胶囊（场景 ×次数），复用 chip-ro 只读样式 -->
        <div class="report-sec" v-if="reportContent.scenes && reportContent.scenes.length">
          <div class="report-sec-title">场景分布</div>
          <span v-for="(s, i) in reportContent.scenes" :key="i" class="chip chip-ro" style="margin-left:6px">{{ s.scene }} ×{{ s.count }}</span>
        </div>
        <!-- 今日漫画：后端产出一张多格漫画图 URL；omitempty 下无漫画时 comic 字段省略 → 不渲染 -->
        <div class="report-sec" v-if="reportContent.comic && reportContent.comic.image_url">
          <div class="report-sec-title">今日漫画</div>
          <img :src="reportContent.comic.image_url" :alt="reportContent.comic.caption || '报告漫画'" loading="lazy" class="comic-img" />
        </div>
      </template>

      <!-- ===== 周报 ===== -->
      <template v-else>
        <!-- 趋势图：每条 trend 一张手绘 SVG 折线图 -->
        <div class="report-sec">
          <div class="report-sec-title">趋势</div>
          <template v-if="weeklyCharts.length">
            <div class="trend-chart" v-for="(ch, ci) in weeklyCharts" :key="ci">
              <div class="trend-metric">{{ ch.metric || ('趋势 ' + (ci + 1)) }}</div>
              <!-- viewBox 写死常量（chartGeom 恒为 520x150）：避开 in-DOM 模板把 :viewBox 小写成 :viewbox 的坑 -->
              <svg viewBox="0 0 520 150" role="img" :aria-label="ch.metric || '趋势图'">
                <!-- y 轴标注：顶部 max，底部 min（非负数据 min=0，与旧版一致） -->
                <text class="val" x="4" :y="ch.geom.padT + 4">{{ ch.geom.maxLabel }}</text>
                <text class="val" x="4" :y="ch.geom.baselineY + 3">{{ ch.geom.minLabel }}</text>
                <!-- 0 参考线（zeroY；非负数据即底边基线） -->
                <line class="axis" :x1="ch.geom.padL" :y1="ch.geom.zeroY" x2="506" :y2="ch.geom.zeroY"></line>
                <!-- 折线（≥2 点才画线） -->
                <polyline v-if="ch.geom.pts.length > 1" class="line" :points="ch.geom.polyline"></polyline>
                <!-- 每个点一组（用 SVG 原生 <g>，避免 <template> 在内联 svg 里被 HTML 解析器错解） -->
                <g v-for="(p, pi) in ch.geom.pts" :key="pi">
                  <circle class="dot" :cx="p.x" :cy="p.y" r="2.5"></circle>
                  <text class="val" :x="p.x" :y="p.y - 6" text-anchor="middle">{{ fmtNum(p.v) }}</text>
                  <text class="lbl" :x="p.x" :y="ch.geom.baselineY + 14" text-anchor="middle">{{ p.label }}</text>
                </g>
              </svg>
            </div>
          </template>
          <div v-else class="muted">（无）</div>
        </div>
        <!-- 按话题：名称 + 进度条 + 关键事件/未完成待办/风险 -->
        <div class="report-sec">
          <div class="report-sec-title">按话题</div>
          <div v-if="!(reportContent.by_topic || []).length" class="muted">（无）</div>
          <div class="bytopic" v-for="(bt, bi) in (reportContent.by_topic || [])" :key="bi">
            <div class="bytopic-name">{{ bt.topic }}</div>
            <div class="progress-row">
              <div class="progress-track"><div class="progress-fill" :style="{width: pct(bt.progress) + '%'}"></div></div>
              <span class="progress-pct">{{ pct(bt.progress) }}%</span>
            </div>
            <report-list label="关键事件" :items="bt.key_events || []"></report-list>
            <report-list label="未完成待办" :items="bt.open_todos || []"></report-list>
            <report-list label="风险" :items="bt.risks || []"></report-list>
          </div>
        </div>
        <report-list label="全局风险" :items="reportContent.risks || []"></report-list>
        <report-list label="下周计划" :items="reportContent.next_week || []"></report-list>
        <!-- ===== 深度字段（Task 5）：叙事 / 规律 / 场景分布（周报无 mood_journey） ===== -->
        <report-text label="叙事" :text="reportContent.narrative"></report-text>
        <report-list label="规律" :items="reportContent.patterns || []"></report-list>
        <!-- 场景分布：chip 胶囊（场景 ×次数） -->
        <div class="report-sec" v-if="reportContent.scenes && reportContent.scenes.length">
          <div class="report-sec-title">场景分布</div>
          <span v-for="(s, i) in reportContent.scenes" :key="i" class="chip chip-ro" style="margin-left:6px">{{ s.scene }} ×{{ s.count }}</span>
        </div>
        <!-- 本周漫画：后端产出一张多格漫画图 URL；omitempty 下无漫画时 comic 字段省略 → 不渲染 -->
        <div class="report-sec" v-if="reportContent.comic && reportContent.comic.image_url">
          <div class="report-sec-title">本周漫画</div>
          <img :src="reportContent.comic.image_url" :alt="reportContent.comic.caption || '报告漫画'" loading="lazy" class="comic-img" />
        </div>
      </template>
      <div class="muted" style="margin-top:14px; font-size:var(--fs-xs)" v-if="reportRow && reportRow.created_at">生成于 {{ fmtTime(reportRow.created_at) }}</div>
    </div>

    <!-- 初始/未加载兜底 -->
    <div class="card empty" v-else>选择日期后将自动加载报告。</div>

    <!-- ===== 话题状态报告 ===== -->
    <div class="todo-group-title">话题状态</div>
    <div class="report-toolbar">
      <select class="mini" v-model="statusTopicId" @change="onPickStatusTopic" style="min-width:200px">
        <option value="">选择一个主题…</option>
        <option v-for="t in topics" :key="t.id" :value="t.id">{{ t.name }}</option>
      </select>
      <div class="spacer"></div>
      <button v-if="statusTopicId" class="btn mini" :disabled="topicStatusLoading" @click="loadTopicStatus(true)" title="强制重算">
        <span v-if="topicStatusLoading" class="spinner"></span>{{ topicStatusLoading ? '生成中…' : '刷新' }}
      </button>
    </div>

    <div v-if="!statusTopicId" class="card empty">选择一个主题，查看其状态报告（进展 / 未完成待办 / 风险等）。</div>
    <div v-else-if="topicStatusLoading && !topicStatusContent" class="card">
      <div class="muted" style="margin-bottom:8px"><span class="spinner"></span> 正在生成话题状态…（首次生成需调用模型）</div>
      <div class="skeleton-line med"></div><div class="skeleton-line"></div>
    </div>
    <div v-else-if="topicStatusFailed" class="card">
      <div class="kv">
        <div style="min-width:0">
          <b>生成失败，请重试</b>
          <div class="muted" v-if="topicStatusError">{{ topicStatusError }}</div>
          <div class="muted" v-else>状态内容为空或未成功生成。</div>
        </div>
        <button class="btn primary" style="padding:7px 16px" :disabled="topicStatusLoading" @click="loadTopicStatus(true)">
          <span v-if="topicStatusLoading" class="spinner"></span>{{ topicStatusLoading ? '生成中…' : '重新生成' }}
        </button>
      </div>
    </div>
    <div v-else-if="topicStatusContent" class="card">
      <div class="report-headline" v-html="renderMarkdown(topicStatusContent.summary || '')"></div>
      <div class="progress-row" style="margin-top:8px">
        <div class="progress-track"><div class="progress-fill" :style="{width: pct(topicStatusContent.progress) + '%'}"></div></div>
        <span class="progress-pct">{{ pct(topicStatusContent.progress) }}%</span>
      </div>
      <report-list label="里程碑" :items="topicStatusContent.milestones || []"></report-list>
      <report-list label="决定" :items="topicStatusContent.decisions || []"></report-list>
      <report-list label="未完成待办" :items="topicStatusContent.open_todos || []"></report-list>
      <!-- 风险：带严重度徽标 -->
      <div class="report-sec">
        <div class="report-sec-title">风险</div>
        <div v-if="!(topicStatusContent.risks || []).length" class="muted">（无）</div>
        <div class="risk-item" v-for="(rk, ri) in (topicStatusContent.risks || [])" :key="ri">
          <span class="badge" :class="sevMeta(rk.severity).cls">{{ sevMeta(rk.severity).label }}</span>
          <span class="risk-desc">{{ rk.desc }}</span>
        </div>
      </div>
      <report-list label="阻塞" :items="topicStatusContent.blockers || []"></report-list>
      <div class="muted" style="margin-top:14px; font-size:var(--fs-xs)" v-if="topicStatusRow && topicStatusRow.generated_at">生成于 {{ fmtTime(topicStatusRow.generated_at) }}</div>
    </div>
  </div>

  <!-- ============ 录音 ============ -->
  <div class="wrap" v-if="tab==='record'">
    <div id="drop" :class="{rec: recording}" @dragover.prevent @drop.prevent="onDrop">
      <template v-if="!recording">拖拽音频文件到此处，或点击下方按钮录音</template>
      <template v-else><span class="spinner"></span> 录音中…（{{ recSeconds }}s）</template>
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center">
      <button class="btn primary" v-if="!recording" @click="startRec">开始录音</button>
      <button class="btn primary" v-else @click="stopRec">停止并上传</button>
      <button class="btn mini" :disabled="!lastAudioFile || voiceprintMatching" @click="tryMatchVoiceprint" title="用当前音频匹配已有声纹库，看像谁（不登记）">
        <span v-if="voiceprintMatching" class="spinner"></span>{{ voiceprintMatching ? '匹配中…' : '🔍 试匹配声纹库' }}
      </button>
    </div>
    <div v-if="uploadInfo" class="card" style="margin-top:12px">
      <div class="muted">{{ uploadInfo.filename }}</div>
      <span class="badge" :class="uploadInfo.status">{{ uploadInfo.text }}</span>
    </div>
    <!-- 声纹匹配预览：全库每个声纹的匹配度(余弦) 排序列表 + 阈值；命中/未达阈值徽标 -->
    <div v-if="matchInfo" class="card" style="margin-top:10px">
      <div class="kv">
        <div style="min-width:0">
          <b>声纹匹配</b>
          <span class="muted" style="margin-left:6px">共 {{ (matchInfo.matches||[]).length }} 个声纹 · 阈值 {{ (matchInfo.threshold||0).toFixed(2) }}</span>
        </div>
        <span class="badge" :class="matchInfo.matched ? 'done' : 'dismissed'">{{ matchInfo.matched ? '有命中' : '无命中' }}</span>
      </div>
      <div v-if="matchInfo.has_library" style="margin-top:8px">
        <div v-for="(m, i) in matchInfo.matches" :key="m.speaker_id" style="display:flex; align-items:center; gap:8px; padding:3px 0">
          <span class="muted" style="width:16px; text-align:right">{{ i+1 }}</span>
          <b style="min-width:64px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ m.name }}</b>
          <div style="flex:1; height:6px; background:var(--surface-sunken); border-radius:3px; overflow:hidden">
            <div :style="{width: Math.max(2, Math.min(100, (m.similarity||0)*100))+'%', background: (m.similarity||0) >= matchInfo.threshold ? 'var(--ok)' : 'var(--muted)'}" style="height:100%"></div>
          </div>
          <span :style="{color: (m.similarity||0) >= matchInfo.threshold ? 'var(--ok)' : 'var(--muted)', width:46, 'text-align':'right', 'font-variant-numeric':'tabular-nums'}">{{ (m.similarity||0).toFixed(3) }}</span>
        </div>
      </div>
      <div v-else class="muted" style="margin-top:6px">声纹库为空，暂无可匹配说话人</div>
    </div>
  </div>

  <!-- ============ 声纹 ============ -->
  <!-- 声纹名册管理：列表 + 录入 + 改名 + 删除；点开某声纹看其跨录音的关联片段，按时间段播放。 -->
  <div class="wrap" v-if="tab==='voiceprint'">
    <div class="kv" style="margin-bottom:12px">
      <b style="font-size:var(--fs-lg)">声纹</b>
      <div style="display:flex; gap:6px">
        <button v-if="!spMergeMode" class="btn mini" @click="startSpMerge" title="选择多个说话人合并到一个（纠正同人被拆成多个说话人）">手动合并</button>
        <button v-if="!spMergeMode" class="btn primary" style="padding:7px 16px" @click="toggleEnrollForm">{{ showEnrollForm ? '收起' : '＋ 录入' }}</button>
        <button v-else class="btn warn" @click="cancelSpMerge">取消合并</button>
      </div>
    </div>

    <!-- 搜索（客户端过滤说话人名称） -->
    <div class="toolbar" v-if="allSpeakers.length">
      <input class="txt" v-model="speakerSearch" placeholder="搜索声纹名称…" style="max-width:280px">
      <div class="spacer"></div>
      <span class="muted">{{ filteredSpeakers.length }} 人</span>
    </div>

    <!-- 录入表单（复用 enrollForm / enrolling / submitEnroll / onEnrollDrop） -->
    <div class="card" v-if="showEnrollForm">
      <div class="kv" style="margin-bottom:12px"><b>录入声纹</b><button class="btn-link" @click="showEnrollForm=false">✕</button></div>
      <label class="field-label">名称</label>
      <input class="txt" v-model="enrollForm.name" placeholder="如：张三" style="margin-bottom:8px">
      <label class="field-label">照着念下面这段（任意一段即可，录 5-30s 干净人声）</label>
      <div class="card sunken" style="margin-bottom:8px; padding:10px 14px; font-size:var(--fs-md); line-height:1.7">
        {{ enrollPromptText }}
      </div>
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px">
        <button class="btn" :class="enrollRecording ? 'danger' : 'primary'" @click="enrollRecording ? stopEnrollRec() : startEnrollRec()">
          <span v-if="enrollRecording" class="spinner"></span>{{ enrollRecording ? ('录音中…' + enrollRecSeconds + 's，再点停止') : '🎤 麦克风录入' }}
        </button>
        <span v-if="enrollForm.file" class="muted">✓ {{ enrollForm.file.name }}</span>
      </div>
      <div @dragover.prevent @drop.prevent="onEnrollDrop" style="border:2px dashed var(--border-strong); border-radius:9px; padding:14px; text-align:center; color:var(--muted); margin-bottom:8px">
        或拖拽 wav/mp3 到此处
      </div>
      <div class="edit-actions">
        <button class="btn primary" :disabled="!enrollForm.name.trim()||!enrollForm.file||enrolling" @click="submitEnroll">
          <span v-if="enrolling" class="spinner"></span>{{ enrolling?'录入中…':'录入' }}
        </button>
        <button class="btn mini" @click="showEnrollForm=false">取消</button>
      </div>
    </div>

    <div v-if="!allSpeakers.length" class="card empty">还没有声纹。点上方「录入」或上传录音后自动登记。</div>
    <div v-if="allSpeakers.length && !filteredSpeakers.length" class="card empty">没有匹配的声纹。</div>
    <!-- 追加声纹的隐藏文件选择器（点「＋ 追加声纹」时按目标说话人唤起） -->
    <input type="file" accept="audio/*" style="display:none" ref="embFileInput" @change="onAddEmbFile">
    <div class="card" v-for="(sp, idx) in filteredSpeakers" :key="sp.id">
      <div class="kv">
        <div style="display:flex; align-items:center; gap:8px; min-width:0; flex-wrap:wrap">
          <input v-if="spMergeMode" type="checkbox" :checked="spMergeSelected.includes(sp.id)" @change="toggleSpSelect(sp)" style="margin:0; flex-shrink:0" title="选择参与合并">
          <span class="sp" :style="{background: speakerColor(idx).bg}" style="color:#fff">{{ idx+1 }}</span>
          <template v-if="!renamingSpeaker || renamingSpeaker.id !== sp.id">
            <b class="editable" @click="startRenameSpeaker(sp)" title="点击改名">{{ sp.name }}<span class="hint">✎</span></b>
            <span class="muted">{{ sp.source==='enrolled' ? '手动录入' : '自动登记' }} · {{ sp.sample_count || 0 }} 样本</span>
            <!-- 绑定人物（名册富化 person_id/person_name）：绑定后声纹名已同步为人物名（不变式），
                 徽标点击跳人物 tab 展开详情；✎ 打开「关联/换绑/解绑」编辑行。 -->
            <template v-if="sp.person_id">
              <span class="chip" style="cursor:pointer; background:var(--accent-soft); color:var(--accent)"
                    @click="jumpToPerson(sp.person_id)" title="查看人物详情">👤 {{ sp.person_name }}</span>
              <button class="btn-link" @click="startSpPersonEdit(sp)" title="换绑/解绑人物">✎</button>
            </template>
            <button v-else class="btn-link" @click="startSpPersonEdit(sp)" title="关联人物">＋ 关联人物</button>
          </template>
          <template v-else>
            <input class="txt inline" v-model="renamingSpeaker.name" @keyup.enter="commitRenameSpeaker" @keyup.esc="renamingSpeaker=null">
            <button class="btn primary" style="padding:6px 12px" @click="commitRenameSpeaker">改名</button>
            <button class="btn mini" @click="renamingSpeaker=null">取消</button>
          </template>
        </div>
        <div v-if="!spMergeMode" style="display:flex; gap:6px; flex-shrink:0">
          <button class="btn mini" @click="toggleSpeakerSegments(sp.id)">
            {{ expandedSpeakerId===sp.id ? '收起' : '关联录音 ▾' }}
            <span v-if="expandedSpeakerId===sp.id && speakerSegLoading" class="spinner"></span>
          </button>
          <button class="btn mini" @click="askDeleteSpeaker(sp)">删除</button>
        </div>
      </div>

      <!-- 人物关联编辑行：下拉选已有人物 / 新建并关联 / 解绑；保存后后端同步声纹名=人物名 -->
      <div v-if="spPersonEdit && spPersonEdit.speakerId === sp.id" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0">
        <span class="muted" style="font-size:var(--fs-xs)">关联人物</span>
        <select class="txt inline" v-model="spPersonEdit.personId">
          <option v-if="spPersonEdit.boundPersonId" value="">解绑（声纹保留现名）</option>
          <option value="__new__">＋ 新建人物（用声纹名「{{ sp.name }}」）</option>
          <option v-for="p in unboundPersons" :key="p.id" :value="p.id">{{ p.display_name }}</option>
        </select>
        <button class="btn primary" style="padding:6px 12px" :disabled="spPersonSaving" @click="commitSpPersonEdit">保存</button>
        <button class="btn mini" @click="spPersonEdit=null">取消</button>
      </div>

      <!-- 建议名字：随机名声纹的 LLM 候选（名称+置信度数值，倒排）；采纳后名字即确认、候选清空 -->
      <div v-if="hasNameCandidates(sp)" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:6px 0">
        <span class="muted" style="font-size:var(--fs-xs)">建议名字</span>
        <span v-for="c in sp.name_candidates" :key="c.name" class="chip"
              style="cursor:default" :title="c.evidence || '无依据记录'">
          {{ c.name }} · {{ c.confidence.toFixed(2) }}
          <button class="chip-x" @click.stop="acceptNameCandidate(sp, c)" title="采纳为正式名">✓</button>
          <button class="chip-x" @click.stop="dismissNameCandidate(sp, c)" title="忽略该候选（下次识别可能再次建议；采纳后不再）">✕</button>
        </span>
      </div>

      <!-- 展开：声纹样本（多条）+ 关联录音（按 session 分组）+ 按时间段播放 -->
      <div v-if="expandedSpeakerId===sp.id" style="margin-top:10px">
        <!-- 多条声纹样本：备注/创建时间/来源，可改备注、删单条、追加新样本 -->
        <div style="margin-bottom:10px">
          <div class="muted" style="font-weight:600; margin-bottom:4px">声纹样本（{{ (sp.embeddings||[]).length }} 条）</div>
          <div v-if="!(sp.embeddings||[]).length" class="muted" style="font-size:var(--fs-xs); margin-bottom:4px">暂无样本（代表向量为空，不再被声纹匹配命中；追加一条即可恢复）。</div>
          <div v-for="e in sp.embeddings" :key="e.id" class="seg">
            <div class="seg-text">
              <div>
                {{ e.note || '（无备注）' }}
                <span class="chip" style="background:var(--surface-sunken); color:var(--text-2)">{{ embSourceText(e.source) }}</span>
                <span class="chip">{{ e.sample_count }} 样本</span>
              </div>
              <div class="muted" style="font-size:var(--fs-xs)">录入于 {{ fmtTime(e.created_at) }}</div>
            </div>
            <div style="display:flex; gap:4px; flex-shrink:0">
              <template v-if="editingEmbNote && editingEmbNote.id === e.id">
                <input class="txt inline" v-model="editingEmbNote.note" @keyup.enter="commitEmbNote(sp, e)" @keyup.esc="editingEmbNote=null" style="width:160px">
                <button class="btn primary" style="padding:6px 12px" @click="commitEmbNote(sp, e)">存</button>
                <button class="btn mini" @click="editingEmbNote=null">取消</button>
              </template>
              <template v-else-if="deletingEmbId === e.id">
                <span class="muted">删除？</span>
                <button class="btn mini danger" @click="confirmDeleteEmb(sp, e)">确认</button>
                <button class="btn mini" @click="deletingEmbId=null">取消</button>
              </template>
              <template v-else>
                <button class="btn mini" @click="startEditEmbNote(e)" title="改备注">✎</button>
                <button class="btn mini danger" @click="deletingEmbId = e.id" title="删这条声纹样本（代表向量重算）">🗑</button>
              </template>
            </div>
          </div>
          <!-- 追加一条声纹：选文件即上传（备注可选） -->
          <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; align-items:center">
            <input class="txt inline" v-model="addEmbNotes[sp.id]" placeholder="备注（可空，如：安静房间录）" style="max-width:230px">
            <button class="btn mini" :disabled="addingEmbId === sp.id" @click="triggerAddEmb(sp)" title="上传一段新录音作为该人的追加声纹；代表向量按全部样本聚合重算">
              <span v-if="addingEmbId === sp.id" class="spinner"></span>{{ addingEmbId === sp.id ? '上传中…' : '＋ 追加声纹' }}
            </button>
          </div>
        </div>

        <!-- 共用一个 <audio>：切片段时按需换 src / seek（详见 app.js playSpeakerSegment） -->
        <audio ref="voiceAudioEl" controls preload="none" style="width:100%; margin-bottom:8px"
               @timeupdate="onVoiceAudioTimeUpdate"></audio>
        <div v-if="speakerSegLoading" class="muted">加载中…</div>
        <div v-else-if="!speakerSegments.length" class="muted">该声纹暂无关联录音段。</div>
        <div v-for="(g, gi) in speakerSegmentsBySession" :key="gi" style="margin-bottom:10px">
          <div class="muted" style="font-weight:600">{{ g.label }} · {{ g.items.length }} 段</div>
          <div v-for="seg in g.items" :key="seg.segment_id" class="seg">
            <button class="btn mini" @click="playSpeakerSegment(seg)" style="flex-shrink:0"
                    :style="playingSegId===seg.segment_id ? {background:'var(--accent)', color:'#fff', borderColor:'var(--accent)'} : {}">
              {{ playingSegId===seg.segment_id ? '▶ 播放中' : '▶ 播放' }}
            </button>
            <div class="seg-text">
              <div>{{ seg.text }}</div>
              <div class="muted">{{ fmtSec(seg.start_ms) }} - {{ fmtSec(seg.end_ms) }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- 手动合并确认条（参考主题页手动合并的 sticky 底栏）：选模式 → 开始合并 → 选目标 → 确认 -->
    <div class="card" v-if="spMergeMode" style="position:sticky; bottom:0">
      <div class="kv">
        <div class="muted">已选 {{ spMergeSelected.length }} 个说话人</div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
          <template v-if="!spMergeConfirming">
            <button class="btn primary" style="padding:7px 14px" :disabled="spMergeSelected.length < 2" @click="startSpConfirm">开始合并</button>
          </template>
          <template v-else>
            <span class="muted">保留目标：</span>
            <select class="mini" v-model="spMergeTarget">
              <option v-for="id in spMergeSelectedSorted" :key="id" :value="id">{{ (allSpeakers.find(s => s.id === id) || {}).name || id }}</option>
            </select>
            <button class="btn primary" style="padding:7px 14px" @click="applySpMerge">确认合并</button>
          </template>
          <button class="btn mini" @click="cancelSpMerge">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 人物 tab：名册 + 详情（就地展开）+ 确认队列 + 回填 -->
  <div class="wrap" v-if="tab==='persons'">
    <div class="kv" style="margin-bottom:12px">
      <b style="font-size:var(--fs-lg)">人物</b>
      <div style="display:flex; gap:6px">
        <button class="btn mini" @click="runBackfill" :disabled="backfilling">
          <span v-if="backfilling" class="spinner"></span>{{ backfilling ? '抽取中…' : '从历史抽取画像' }}
        </button>
        <button class="btn primary" style="padding:7px 16px" @click="toggleNewPerson">{{ showNewPerson ? '收起' : '＋ 新建' }}</button>
      </div>
    </div>

    <!-- 回填进行中提示：/api/profile/extract 是同步端点，处理最近 50 段录音时可能长时间
         无响应，给一行 muted 小字告诉用户「在跑、没卡死」，避免误以为按钮失灵而反复点击。
         样式对齐既有 muted+fs-xs 提示（如下方待确认区说明）。 -->
    <div v-if="backfilling" class="muted" style="font-size:var(--fs-xs); margin-bottom:12px">
      正在处理最近 50 段录音的画像抽取，期间可能无响应，请稍候…
    </div>

    <!-- 回填结果摘要（最近 50 段录音同步重放；单段失败不中断） -->
    <div class="card sunken" v-if="backfillInfo" style="margin-bottom:12px">
      <div class="kv">
        <span class="muted">已回填 {{ backfillInfo.processed }} 段录音：{{ backfillInfo.active }} 条生效 · {{ backfillInfo.pending }} 条待确认 · {{ backfillInfo.skipped }} 条跳过<span v-if="backfillInfo.errors"> · {{ backfillInfo.errors }} 段失败</span></span>
        <button class="btn-link" @click="backfillInfo=null">✕</button>
      </div>
    </div>

    <!-- 确认队列：低置信/冲突的 AI 建议（全局，与人物详情无关） -->
    <div class="card" v-if="pendingItems.length" style="border-color:var(--warn)">
      <div class="kv" style="margin-bottom:8px">
        <b style="color:var(--warn)">待确认 <span class="chip" style="background:var(--warn-soft); color:var(--warn)">{{ pendingItems.length }}</span></b>
        <span class="muted" style="font-size:var(--fs-xs)">AI 从对话中抽取的低置信/冲突信息，确认后生效</span>
      </div>
      <div v-for="it in pendingItems" :key="it.kind + '-' + it.id" class="seg" style="align-items:flex-start">
        <span class="chip" style="background:var(--surface-sunken); color:var(--text-2)">{{ pendingKindText(it.kind) }}</span>
        <div class="seg-text">
          <div>
            <b>{{ it.person_name }}</b><span v-if="it.kind !== 'person'"> · {{ pendingSummary(it) }}</span>
            <span v-if="it.kind === 'person'" class="muted">LLM 自动新建的人物</span>
            <span v-if="it.current_value" class="muted">（现值：{{ it.current_value }} → 建议改为 <b>{{ it.value }}</b>）</span>
          </div>
          <div v-if="it.kind !== 'person'" class="muted" style="font-size:var(--fs-xs)">
            置信度 {{ (it.confidence * 100).toFixed(0) }}%
            <span v-if="it.occurred_at"> · {{ fmtEventDate(it.occurred_at, true) }}</span>
            <span v-if="it.measured_at"> · {{ fmtEventDate(it.measured_at, true) }}</span>
            <span v-if="it.session_id" style="cursor:pointer; text-decoration:underline" @click="jumpToSession(it.session_id)">来源录音</span>
          </div>
        </div>
        <div style="display:flex; gap:4px; flex-shrink:0">
          <button class="btn mini" style="background:var(--ok-soft); color:var(--ok); border-color:var(--ok)" :disabled="queueBusyIds[it.kind + '-' + it.id]" @click="confirmPendingItem(it)">✓ 确认</button>
          <button class="btn mini danger" :disabled="queueBusyIds[it.kind + '-' + it.id]" @click="dismissPendingItem(it)">✕ 放弃</button>
        </div>
      </div>
    </div>
    <div v-else-if="pendingLoading" class="card empty">加载待确认项…</div>

    <!-- 新建人物 -->
    <div class="card" v-if="showNewPerson">
      <div class="kv" style="margin-bottom:12px"><b>新建人物</b><button class="btn-link" @click="cancelNewPerson">✕</button></div>
      <label class="field-label">姓名 *</label>
      <input class="txt" v-model="newPerson.display_name" placeholder="如：张三" style="margin-bottom:8px">
      <label class="field-label">关联声纹（可空；只被提到的人可不绑）</label>
      <select class="txt" v-model="newPerson.speaker_id" style="margin-bottom:8px">
        <option value="">不关联声纹（可留空）</option>
        <option v-for="sp in newPersonSpeakers" :key="sp.id" :value="sp.id">{{ sp.name }}（{{ sp.id }}）</option>
      </select>
      <label class="field-label">备注</label>
      <input class="txt" v-model="newPerson.summary" placeholder="一句话备注（可空）" style="margin-bottom:8px">
      <div class="edit-actions">
        <button class="btn primary" :disabled="creatingPerson" @click="createPerson">
          <span v-if="creatingPerson" class="spinner"></span>{{ creatingPerson ? '创建中…' : '创建' }}
        </button>
        <button class="btn mini" @click="cancelNewPerson">取消</button>
      </div>
    </div>

    <!-- 名册卡片 + 就地展开的详情：template 包一层，让详情卡渲染在所点人物卡片正下方
         （对齐时间线 session 的就地展开模式），而不是整个列表末尾——长名册时列表末尾的详情根本看不到 -->
    <!-- 搜索（客户端过滤姓名） -->
    <div class="toolbar" v-if="persons.length">
      <input class="txt" v-model="personSearch" placeholder="搜索人物姓名…" style="max-width:280px">
      <div class="spacer"></div>
      <span class="muted">{{ filteredPersons.length }} 人</span>
    </div>
    <div v-if="!persons.length" class="card empty">还没有人物。点「新建」，或上传录音后由画像抽取自动生成。</div>
    <div v-if="persons.length && !filteredPersons.length" class="card empty">没有匹配的人物。</div>
    <template v-for="p in filteredPersons" :key="p.id">
    <div class="card clickable" @click="togglePerson(p.id)">
      <div class="kv">
        <div style="display:flex; align-items:center; gap:8px; min-width:0; flex-wrap:wrap">
          <b>{{ p.display_name }}</b>
          <span v-if="p.is_owner" class="chip">我</span>
          <span v-if="p.speaker_id" class="muted" title="已关联声纹">🎙</span>
          <span v-if="p.source === 'llm'" class="muted">自动识别</span>
        </div>
        <div style="display:flex; gap:6px; align-items:center; flex-shrink:0" @click.stop>
          <span v-if="p.pending_count" class="chip" style="background:var(--warn-soft); color:var(--warn)" title="待确认的属性/关系数">{{ p.pending_count }} 待确认</span>
          <template v-if="deletingPersonId === p.id">
            <span class="muted">删除？</span>
            <button class="btn mini danger" @click="confirmDeletePerson(p)">确认</button>
            <button class="btn mini" @click="cancelDeletePerson()">取消</button>
          </template>
          <button v-else class="btn mini" @click="askDeletePerson(p)" title="软删（status=dismissed）+ 六平面级联；可在下方「已删除」区恢复">删除</button>
        </div>
      </div>
    </div>

    <!-- 人物详情（就地展开在所点人物卡片正下方；仅渲染匹配当前迭代 p 的那份；Task 1 已定义 togglePerson/closePersonDetail 数据流） -->
    <div class="card" v-if="personDetail && personDetail.person.id === p.id" style="border-color:var(--accent)">
      <div class="kv" style="margin-bottom:12px">
        <div style="display:flex; align-items:center; gap:8px; min-width:0; flex-wrap:wrap">
          <template v-if="!renamingPerson">
            <b style="font-size:var(--fs-md)">{{ personDetail.person.display_name }}</b>
            <span v-if="personDetail.person.is_owner" class="chip">我</span>
            <!-- 声纹徽标：显示声纹名（详情接口 speaker_name 富化；声纹行被删的悬挂外键降级显 id）。 -->
            <span v-if="personDetail.person.speaker_id" class="muted">🎙 {{ personDetail.speaker_name || personDetail.person.speaker_id }}</span>
            <button class="btn-link" @click="startRenamePerson" title="改名">✎</button>
          </template>
          <template v-else>
            <input class="txt inline" v-model="renamingPerson.name" @keyup.enter="commitRenamePerson" @keyup.esc="renamingPerson=null">
            <button class="btn primary" style="padding:6px 12px" @click="commitRenamePerson">保存</button>
            <button class="btn mini" @click="renamingPerson=null">取消</button>
          </template>
        </div>
        <!-- 声纹关联行：非编辑态显示当前绑定 + 「关联/换绑」入口；编辑态为下拉（不关联=解绑，
             选项已过滤被其他人物占用的声纹，冲突兜底后端 409）。 -->
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px">
          <template v-if="!bindingSpeaker">
            <span class="muted" style="font-size:var(--fs-xs)">{{ personDetail.person.speaker_id ? '已关联声纹' : '未关联声纹' }}</span>
            <button class="btn-link" @click="startBindingSpeaker" title="关联/换绑声纹">{{ personDetail.person.speaker_id ? '🎙 换绑' : '🎙 关联声纹' }}</button>
          </template>
          <template v-else>
            <select class="txt inline" v-model="bindingSpeaker.speaker_id">
              <option value="">不关联（解绑）</option>
              <option v-for="s in bindableSpeakers" :key="s.id" :value="s.id">{{ s.name }}（{{ s.sample_count }} 条样本）</option>
            </select>
            <button class="btn primary" style="padding:6px 12px" :disabled="bindingSaving" @click="commitBindingSpeaker">保存</button>
            <button class="btn mini" @click="bindingSpeaker=null">取消</button>
          </template>
        </div>
        <button class="btn mini" @click="closePersonDetail">收起 ✕</button>
      </div>
      <div v-if="personDetail.person.summary" class="muted" style="margin-bottom:8px">{{ personDetail.person.summary }}</div>

      <!-- 最近互动（溯源 session，点击跳时间线展开） -->
      <div v-if="personDetail.recent_session_ids && personDetail.recent_session_ids.length" style="margin-bottom:10px">
        <span class="muted" style="font-size:var(--fs-xs)">最近互动</span>
        <span v-for="sid in personDetail.recent_session_ids" :key="sid" class="chip" style="cursor:pointer; margin-left:4px"
              @click="jumpToSession(sid)" title="在时间线打开该录音">🎤</span>
      </div>

      <!-- 分组属性区（后端已按 GroupOrder 分组、只含 active+pending） -->
      <div v-for="g in personDetail.groups" :key="g.group" style="margin-bottom:12px">
        <div class="muted" style="font-weight:600; margin-bottom:4px">{{ g.group }}</div>
        <div v-for="a in g.attrs" :key="a.id" class="seg">
          <div class="seg-text">
            <div>
              {{ attrLabel(a.attr_key) }}：<b>{{ a.value_text }}</b>
              <span class="chip chip-ro"
                    :style="a.source === 'llm' ? { background:'var(--accent-soft)', color:'var(--accent)' } : { background:'var(--ok-soft)', color:'var(--ok)' }">{{ a.source === 'llm' ? 'AI' : '人工' }}</span>
              <span class="chip chip-ro">{{ (a.confidence * 100).toFixed(0) }}%</span>
              <span class="chip chip-ro" style="background:var(--surface-sunken); color:var(--text-2)">{{ epiText(a.epistemic_type) }}</span>
              <span v-if="a.status === 'pending'" class="chip chip-ro" style="background:var(--warn-soft); color:var(--warn)">待确认</span>
              <span v-if="a.session_id" class="chip chip-ro src-link" @click.stop="jumpToSession(a.session_id)" title="跳到来源录音时间线">↪ 来源</span>
            </div>
          </div>
          <div style="display:flex; gap:4px; flex-shrink:0">
            <template v-if="editingAttr && editingAttr.id === a.id">
              <!-- 就地改值同样按该行 attr_key 的 value_type 切受控控件（F4 配套，规则同加属性表单） -->
              <select v-if="editAttrDef && editAttrDef.value_type === 'enum'" class="txt inline" v-model="editingAttr.value">
                <option value="">请选择</option>
                <option v-for="opt in editAttrDef.enum_options" :key="opt" :value="opt">{{ opt }}</option>
              </select>
              <select v-else-if="editAttrDef && editAttrDef.value_type === 'bool'" class="txt inline" v-model="editingAttr.value">
                <!-- option value 即后端 true/false 线值，「是/否」仅展示文案（同加属性表单，无需提交前映射） -->
                <option value="">请选择</option>
                <option value="true">是</option>
                <option value="false">否</option>
              </select>
              <input v-else-if="editAttrDef && editAttrDef.value_type === 'date'" class="txt inline" type="date" v-model="editingAttr.value">
              <input v-else class="txt inline" v-model="editingAttr.value" @keyup.enter="commitEditAttr" @keyup.esc="editingAttr=null">
              <button class="btn primary" style="padding:6px 12px" @click="commitEditAttr">存</button>
              <button class="btn mini" @click="editingAttr=null">取消</button>
            </template>
            <template v-else-if="deletingAttrId === a.id">
              <span class="muted">删除？</span>
              <button class="btn mini danger" @click="confirmDeleteAttr">确认</button>
              <button class="btn mini" @click="deletingAttrId=null">取消</button>
            </template>
            <template v-else>
              <button v-if="a.status !== 'pending'" class="btn mini" @click="startEditAttr(a)" title="改值（旧行留痕）">✎</button>
              <button class="btn mini" @click="showAttrHistory(a)" title="修改历史">⟲</button>
              <button class="btn mini danger" @click="askDeleteAttr(a)" title="删除">🗑</button>
            </template>
          </div>
        </div>
      </div>
      <div v-if="!personDetail.groups || !personDetail.groups.length" class="muted" style="margin-bottom:12px">暂无属性。</div>

      <!-- 关系区 -->
      <div v-if="personDetail.relationships && personDetail.relationships.length" style="margin-bottom:12px">
        <div class="muted" style="font-weight:600; margin-bottom:4px">关系</div>
        <div v-for="rel in personDetail.relationships" :key="rel.id" class="seg">
          <div class="seg-text">
            <div>
              <b>{{ rel.relation_type }}</b>
              <span v-if="rel.related_person_id" class="muted"> → {{ personNameOf(rel.related_person_id) }}</span>
              <span v-if="rel.org_name" class="muted"> · {{ rel.org_name }}</span>
              <span v-if="rel.label" class="muted"> · {{ rel.label }}</span>
              <span v-if="rel.direction" class="muted"> · {{ rel.direction }}</span>
              <span v-if="rel.status === 'pending'" class="chip" style="background:var(--warn-soft); color:var(--warn)">待确认</span>
            </div>
          </div>
          <div style="display:flex; gap:4px; flex-shrink:0">
            <template v-if="deletingRelId === rel.id">
              <span class="muted">删除？</span>
              <button class="btn mini danger" @click="confirmDeleteRel">确认</button>
              <button class="btn mini" @click="deletingRelId=null">取消</button>
            </template>
            <button v-else class="btn mini danger" @click="askDeleteRel(rel)" title="删除关系">🗑</button>
          </div>
        </div>
      </div>

      <!-- 宠物（pet 平面）：一只一行卡片（名/小名/类别·品种/性别/年龄·生日/喜好） -->
      <div style="margin-bottom:12px">
        <div class="kv" style="margin-bottom:4px">
          <div class="muted" style="font-weight:600">宠物</div>
          <button class="btn mini" @click="toggleAddPet">{{ showAddPet ? '收起' : '＋ 加宠物' }}</button>
        </div>
        <div v-if="petLoading" class="muted">加载中…</div>
        <template v-else>
          <div v-for="pt in petRows" :key="pt.id" class="seg">
            <span class="chip" style="background:var(--surface-sunken); color:var(--text-2)">{{ pt.species }}</span>
            <div class="seg-text">
              <div>
                <b>{{ pt.name }}</b>
                <span v-if="pt.nickname" class="muted"> · 小名 {{ pt.nickname }}</span>
                <span class="chip" :style="pt.source === 'llm' ? { background:'var(--accent-soft)', color:'var(--accent)' } : { background:'var(--ok-soft)', color:'var(--ok)' }">{{ pt.source === 'llm' ? 'AI' : '人工' }}</span>
                <span v-if="pt.status === 'pending'" class="chip" style="background:var(--warn-soft); color:var(--warn)">待确认</span>
              </div>
              <div class="muted" style="font-size:var(--fs-xs)">
                <span v-if="pt.breed">{{ pt.breed }}</span>
                <span v-if="pt.gender"> · {{ pt.gender }}</span>
                <span v-if="pt.age_text"> · {{ pt.age_text }}</span>
                <span v-if="pt.birthday"> · 生日 {{ fmtDateOnly(pt.birthday) }}</span>
                <span v-if="pt.likes"> · {{ pt.likes }}</span>
              </div>
            </div>
            <div style="display:flex; gap:4px; flex-shrink:0">
              <template v-if="deletingPetId === pt.id">
                <span class="muted">删除？</span>
                <button class="btn mini danger" @click="confirmDeletePet">确认</button>
                <button class="btn mini" @click="deletingPetId=null">取消</button>
              </template>
              <template v-else>
                <button class="btn mini" @click="startEditPet(pt)" title="编辑（整只替换，旧行留痕）">✎</button>
                <button class="btn mini danger" @click="askDeletePet(pt)" title="删除宠物">🗑</button>
              </template>
            </div>
          </div>
          <div v-if="!petRows.length" class="muted" style="font-size:var(--fs-xs)">暂无宠物。从对话自动抽取或手动添加。</div>
        </template>
        <!-- 加/编辑宠物表单（同一张表单：editingPetId 空=新增，非空=编辑回填） -->
        <div class="card sunken" v-if="showAddPet" style="margin-top:8px">
          <div class="kv" style="margin-bottom:8px"><b>{{ editingPetId ? '编辑宠物' : '加宠物' }}</b><button class="btn-link" @click="toggleAddPet">✕</button></div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
            <input class="txt" v-model="addPetForm.name" placeholder="名字（如 小花）*" style="flex:1; min-width:100px">
            <input class="txt" v-model="addPetForm.nickname" placeholder="小名（可空）" style="flex:1; min-width:100px">
            <select class="txt" v-model="addPetForm.species" style="min-width:90px">
              <option v-for="sp in PET_SPECIES" :key="sp" :value="sp">{{ sp }}</option>
            </select>
            <input class="txt" v-model="addPetForm.breed" placeholder="品种（可空）" style="flex:1; min-width:100px">
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px">
            <select class="txt" v-model="addPetForm.gender" style="min-width:80px">
              <option value="">性别</option>
              <option value="公">公</option>
              <option value="母">母</option>
            </select>
            <input class="txt" v-model="addPetForm.age_text" placeholder="年龄（如 3岁）" style="flex:1; min-width:90px">
            <input class="txt" v-model="addPetForm.birthday" type="date" title="生日（手动必填）" style="width:auto; min-width:130px">
            <input class="txt" v-model="addPetForm.likes" placeholder="喜好（可空）" style="flex:1; min-width:120px">
            <button class="btn primary" :disabled="savingPet" @click="submitPet">{{ savingPet ? '保存中…' : '保存' }}</button>
          </div>
          <div class="muted" style="font-size:var(--fs-xs); margin-top:4px">名字与生日必填；生日手动录入须为准确日期（YYYY-MM-DD）。手动添加立即生效（来源=人工 · 置信度 100%）。</div>
        </div>
      </div>

      <!-- 大事记（按年分组，时间倒序；与属性/关系互补：属性记「有过的」，大事记记「某次发生的」） -->
      <div v-if="personDetail.events && personDetail.events.length" style="margin-bottom:12px">
        <div class="muted" style="font-weight:600; margin-bottom:4px">大事记</div>
        <div v-for="g in eventsByYear" :key="g.year" style="margin-bottom:8px">
          <div class="muted" style="font-size:var(--fs-xs); margin:4px 0">{{ g.year }}</div>
          <!-- 重要度视觉分层（P7）：左侧 accent 竖条(重大≥0.8)+透明度淡显(日常<0.6)映射人生分量，
               纯视觉不暴露数值；hover title 才给数值（见 app.js eventRowStyle） -->
          <div v-for="ev in g.items" :key="ev.id" class="seg" :style="eventRowStyle(ev)"
               :title="'重要度 ' + (typeof ev.importance === 'number' ? ev.importance.toFixed(1) : '—')">
            <span class="chip" style="background:var(--surface-sunken); color:var(--text-2)">{{ ev.event_type }}</span>
            <div class="seg-text">
              <div>
                <b>{{ ev.title }}</b>
                <span class="muted"> · {{ fmtEventDate(ev.occurred_at, g.year === '时间未知') }}</span>
                <span v-if="ev.end_at" class="muted"> 至 {{ fmtEventDate(ev.end_at, g.year === '时间未知') }}</span>
                <span v-if="ev.location" class="muted"> · {{ ev.location }}</span>
                <span v-if="ev.related_person_ids && ev.related_person_ids.length" class="muted"> · 与 {{ ev.related_person_ids.map(id => personNameOf(id)).join('、') }} 同行/同场</span>
                <span class="chip chip-ro" :style="ev.source === 'llm' ? { background:'var(--accent-soft)', color:'var(--accent)' } : { background:'var(--ok-soft)', color:'var(--ok)' }">{{ ev.source === 'llm' ? 'AI' : '人工' }}</span>
                <span v-if="ev.status === 'pending'" class="chip chip-ro" style="background:var(--warn-soft); color:var(--warn)">待确认</span>
                <span v-if="ev.session_id" class="chip chip-ro src-link" @click.stop="jumpToSession(ev.session_id)" title="跳到来源录音时间线">↪ 来源</span>
              </div>
              <div v-if="ev.description" class="muted" style="font-size:var(--fs-xs)">{{ ev.description }}</div>
            </div>
            <div style="display:flex; gap:4px; flex-shrink:0">
              <template v-if="deletingEventId === ev.id">
                <span class="muted">删除？</span>
                <button class="btn mini danger" @click="confirmDeleteEvent">确认</button>
                <button class="btn mini" @click="deletingEventId=null">取消</button>
              </template>
              <button v-else class="btn mini danger" @click="askDeleteEvent(ev)" title="删除事件">🗑</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 指标（第 5 平面 person_metric：与大事记同构——大事记记「某次发生」，指标记「某刻测得的读数」）。
           每组标题=中文名(+单位)；numeric 组且 ≥2 数值点额外画趋势曲线（复用周报手绘 SVG 块）。 -->
      <div v-if="personDetail.metrics && personDetail.metrics.length" style="margin-bottom:12px">
        <div class="muted" style="font-weight:600; margin-bottom:4px">指标</div>
        <div v-for="g in personDetail.metrics" :key="g.key" style="margin-bottom:8px">
          <div class="muted" style="font-size:var(--fs-xs); margin:4px 0">{{ g.label }}<template v-if="g.unit">（{{ g.unit }}）</template></div>
          <!-- 趋势曲线：仅 numeric 组且 ≥2 数值点（metricCharts 已按组预算好几何）。viewBox 固定 520x150。 -->
          <div v-if="metricCharts[g.key]" class="trend-chart">
            <svg viewBox="0 0 520 150" role="img" :aria-label="g.label + ' 趋势'">
              <!-- y 轴标注：顶部 max，底部 min（情绪等负值指标 min<0，0 线在 zeroY） -->
              <text class="val" x="4" :y="metricCharts[g.key].padT + 4">{{ metricCharts[g.key].maxLabel }}</text>
              <text class="val" x="4" :y="metricCharts[g.key].baselineY + 3">{{ metricCharts[g.key].minLabel }}</text>
              <!-- 0 参考线（zeroY；非负数据即底边基线） -->
              <line class="axis" :x1="metricCharts[g.key].padL" :y1="metricCharts[g.key].zeroY" x2="506" :y2="metricCharts[g.key].zeroY"></line>
              <!-- 折线（≥2 点才画线） -->
              <polyline v-if="metricCharts[g.key].pts.length > 1" class="line" :points="metricCharts[g.key].polyline"></polyline>
              <!-- 每个点一组（SVG 原生 <g>，避免 <template> 在内联 svg 里被 HTML 解析器错解） -->
              <g v-for="(pt, pi) in metricCharts[g.key].pts" :key="pi">
                <circle class="dot" :cx="pt.x" :cy="pt.y" r="2.5"></circle>
                <text class="val" :x="pt.x" :y="pt.y - 6" text-anchor="middle">{{ fmtNum(pt.v) }}</text>
                <text class="lbl" :x="pt.x" :y="metricCharts[g.key].baselineY + 14" text-anchor="middle">{{ pt.label }}</text>
              </g>
            </svg>
          </div>
          <!-- 各测点列表：measured_at + 值(数值带单位 / 类别描述) + 状态 chip；pending 灰显 -->
          <div v-for="(p, pi) in g.points" :key="pi" class="seg" :style="p.status === 'pending' ? { opacity: 0.6 } : {}">
            <div class="seg-text">
              <div>
                <b>{{ metricPointValue(g, p) }}</b>
                <span class="muted"> · {{ fmtEventDate(p.measured_at, true) }}</span>
                <span v-if="p.status === 'pending'" class="chip" style="background:var(--warn-soft); color:var(--warn)">待确认</span>
              </div>
            </div>
            <!-- 删除测点：需测点带 id（详情 API 的 points 暂未下发 id 时按钮不渲染，避免删到 undefined） -->
            <div v-if="p.id != null" style="display:flex; gap:4px; flex-shrink:0">
              <template v-if="deletingMetricId === p.id">
                <span class="muted">删除？</span>
                <button class="btn mini danger" @click="confirmDeleteMetric">确认</button>
                <button class="btn mini" @click="deletingMetricId=null">取消</button>
              </template>
              <button v-else class="btn mini danger" @click="askDeleteMetric(p)" title="删除测点">🗑</button>
            </div>
          </div>
        </div>
      </div>
      <!-- 健康周期（敏感：默认折叠；展开直显后端免责 note） -->
      <div style="margin-bottom:12px">
        <div class="kv">
          <div class="muted" style="font-weight:600">健康周期 <span class="muted" style="font-size:var(--fs-xs)">（敏感信息）</span></div>
          <button class="btn mini" @click="toggleHealth">{{ healthOpen ? '收起 ▴' : '展开 ▾' }}</button>
        </div>
        <div v-if="healthOpen">
          <!-- 免责文案直显（后端 note，spec §9） -->
          <div v-if="cyclesNote" class="muted" style="font-size:var(--fs-xs); margin:6px 0">ℹ️ {{ cyclesNote }}</div>
          <div v-if="cycleLoading" class="muted">加载中…</div>
          <template v-else>
            <div v-for="c in cycles" :key="c.id" class="seg">
              <span class="chip" style="background:var(--surface-sunken); color:var(--text-2)">{{ cycleTypeLabel(c.cycle_type) }}</span>
              <div class="seg-text">
                <div>
                  <b v-if="c.label">{{ c.label }}</b><!-- 无 label 时类型 chip 已表达身份，不再回退重复显示 -->
                  <span class="chip" :style="c.source === 'llm' ? { background:'var(--accent-soft)', color:'var(--accent)' } : { background:'var(--ok-soft)', color:'var(--ok)' }">{{ c.source === 'llm' ? 'AI' : '人工' }}</span>
                  <span v-if="c.status === 'pending'" class="chip" style="background:var(--warn-soft); color:var(--warn)">待确认</span>
                </div>
                <div class="muted" style="font-size:var(--fs-xs)">
                  上次 {{ fmtDateOnly(c.anchor_date) }}
                  <span v-if="c.period_days"> · 周期 {{ c.period_days }} 天</span>
                  <span v-if="c.next_predicted_at"> · 下次约 {{ fmtDateOnly(c.next_predicted_at) }}</span>
                  <span v-if="c.dosage"> · {{ c.dosage }}</span>
                  <span v-if="c.frequency_text"> · {{ c.frequency_text }}</span>
                </div>
              </div>
              <div style="display:flex; gap:4px; flex-shrink:0">
                <template v-if="deletingCycleId === c.id">
                  <span class="muted">删除？</span>
                  <button class="btn mini danger" @click="confirmDeleteCycle">确认</button>
                  <button class="btn mini" @click="deletingCycleId=null">取消</button>
                </template>
                <button v-else class="btn mini danger" @click="askDeleteCycle(c)" title="删除周期">🗑</button>
              </div>
            </div>
            <div v-if="!cycles.length" class="muted" style="font-size:var(--fs-xs)">暂无周期记录。</div>
          </template>
          <!-- 加周期表单 -->
          <div class="edit-actions" style="margin-top:6px">
            <button class="btn mini" @click="toggleAddCycle">{{ showAddCycle ? '收起添加' : '＋ 加周期' }}</button>
          </div>
          <div class="card sunken" v-if="showAddCycle" style="margin-top:8px">
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
              <select class="txt" v-model="addCycleForm.cycle_type" style="min-width:100px">
                <option value="" disabled>类型</option>
                <option v-for="t in CYCLE_TYPES" :key="t.key" :value="t.key">{{ t.label }}</option>
              </select>
              <input class="txt" v-model="addCycleForm.label" placeholder="名称（药名等；生理期留空）" style="flex:1; min-width:120px">
              <input class="txt" v-model="addCycleForm.anchor_date" type="date" title="上次开始日" style="width:auto; min-width:130px">
              <input class="txt" v-model="addCycleForm.period_days" type="number" min="1" step="1" placeholder="周期天数" style="width:auto; min-width:90px">
              <input class="txt" v-model="addCycleForm.duration_days" type="number" min="1" step="1" placeholder="持续天数" style="width:auto; min-width:90px">
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px">
              <input class="txt" v-model="addCycleForm.dosage" placeholder="剂量（如 1片）" style="flex:1; min-width:100px">
              <input class="txt" v-model="addCycleForm.frequency" placeholder="频次（如 每日一次）" style="flex:1; min-width:100px">
              <button class="btn primary" :disabled="addingCycle" @click="submitAddCycle">{{ addingCycle ? '保存中…' : '保存' }}</button>
            </div>
            <div class="muted" style="font-size:var(--fs-xs); margin-top:4px">下次时间为按周期估算，仅供参考，非医疗建议。</div>
          </div>
        </div>
      </div>

      <!-- 生活轨迹（activity 平面，P4：什么时间 / 多长时间 / 什么工具 / 做什么 / 地点 / 通勤）——时间线列表（升序） -->
      <div style="margin-bottom:12px">
        <div class="kv" style="margin-bottom:4px">
          <div class="muted" style="font-weight:600">生活轨迹</div>
          <span class="muted" style="font-size:var(--fs-xs)">活动时间线（含 AI 抽取）</span>
        </div>
        <div v-if="activityLoading" class="muted">加载中…</div>
        <template v-else>
          <!-- 升序铺开（从早到晚）；活动是类别身份，列时间线而非画曲线 -->
          <div v-for="a in activityRows" :key="a.id" class="seg">
            <div class="seg-text">
              <div>
                <b>{{ a.activity }}</b>
                <span class="chip chip-ro" :style="a.source === 'llm' ? { background:'var(--accent-soft)', color:'var(--accent)' } : { background:'var(--ok-soft)', color:'var(--ok)' }">{{ a.source === 'llm' ? 'AI' : '人工' }}</span>
                <span v-if="a.status === 'pending'" class="chip chip-ro" style="background:var(--warn-soft); color:var(--warn)">待确认</span>
                <span v-if="a.session_id" class="chip chip-ro src-link" @click.stop="jumpToSession(a.session_id)" title="跳到来源录音时间线">↪ 来源</span>
              </div>
              <div class="muted" style="font-size:var(--fs-xs)">
                {{ fmtEventDate(a.started_at, true) }}
                <span v-if="a.duration_min"> · {{ a.duration_min }} 分钟</span>
                <span v-if="a.tool"> · {{ a.tool }}</span>
                <span v-if="a.location"> · {{ a.location }}</span>
                <span v-if="a.commute_mode"> · {{ a.commute_mode }}</span>
              </div>
            </div>
            <div style="display:flex; gap:4px; flex-shrink:0">
              <template v-if="deletingActivityId === a.id">
                <span class="muted">删除？</span>
                <button class="btn mini danger" @click="confirmDeleteActivity">确认</button>
                <button class="btn mini" @click="deletingActivityId=null">取消</button>
              </template>
              <button v-else class="btn mini danger" @click="askDeleteActivity(a)" title="删除活动">🗑</button>
            </div>
          </div>
          <div v-if="!activityRows.length" class="muted" style="font-size:var(--fs-xs)">暂无活动记录。从对话自动抽取或手动添加。</div>
        </template>
        <!-- 手动添加（表单折叠） -->
        <div class="edit-actions" style="margin-top:6px">
          <button class="btn mini" @click="toggleAddActivity">{{ showAddActivity ? '收起添加' : '＋ 加活动' }}</button>
        </div>
        <div class="card sunken" v-if="showAddActivity" style="margin-top:8px">
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
            <input class="txt" v-model="addActivityForm.activity" placeholder="做什么（如 写代码/打球/通勤）*" style="flex:1; min-width:140px">
            <input class="txt" v-model="addActivityForm.tool" placeholder="工具/载体（电脑/手机，可空）" style="flex:1; min-width:110px">
            <input class="txt" v-model="addActivityForm.location" placeholder="地点（可空）" style="flex:1; min-width:100px">
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px">
            <input class="txt" v-model="addActivityForm.commute_mode" placeholder="通勤方式（地铁/开车，可空）" style="flex:1; min-width:110px">
            <input class="txt" v-model="addActivityForm.started_at" type="date" title="开始日期" style="width:auto; min-width:130px">
            <input class="txt" v-model="addActivityForm.duration_min" type="number" min="1" step="1" placeholder="时长（分钟）" style="width:auto; min-width:100px">
            <button class="btn primary" :disabled="addingActivity" @click="submitAddActivity">{{ addingActivity ? '保存中…' : '保存' }}</button>
          </div>
          <div class="muted" style="font-size:var(--fs-xs); margin-top:4px">仅「做什么」必填；日期可空（默认对话当天/今天）。手动添加立即生效（来源=人工 · 置信度 100%）。</div>
        </div>
      </div>

      <!-- 加事件表单 -->
      <div class="card sunken" v-if="showAddEvent" style="margin-bottom:10px">
        <div class="kv" style="margin-bottom:8px"><b>加大事记</b><button class="btn-link" @click="toggleAddEvent">✕</button></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
          <select class="txt" v-model="addEventForm.event_type" style="min-width:100px">
            <option value="" disabled>事件类型</option>
            <option v-for="t in EVENT_TYPES" :key="t" :value="t">{{ t }}</option>
          </select>
          <input class="txt" v-model="addEventForm.title" placeholder="标题（如 去云南旅游一周）*" style="flex:1; min-width:140px">
          <input class="txt" v-model="addEventForm.occurred_at" type="date" title="发生日期" style="width:auto; min-width:130px">
          <input class="txt" v-model="addEventForm.end_at" type="date" title="结束日期（旅行/会议等跨天事件）" style="width:auto; min-width:130px">
          <input class="txt" v-model="addEventForm.location" placeholder="地点（可空）" style="flex:1; min-width:100px">
          <select class="txt" v-model="addEventForm.related_person_ids" multiple size="3" style="min-width:140px"
                  title="同行人物，可多选（按住 Ctrl / ⌘ 点选多个）">
            <option v-for="p in persons.filter(x => x.id !== personDetail.person.id)" :key="p.id" :value="p.id">{{ p.display_name }}</option>
          </select>
          <!-- 重要度三档（P7）：语义档位比数字更贴近「人生分量」；选中档位高亮（accent 底色） -->
          <span class="muted" style="font-size:var(--fs-xs)">重要度</span>
          <button v-for="lv in EVENT_IMPORTANCE_LEVELS" :key="lv.value" type="button" class="btn mini"
                  :style="addEventForm.importance === lv.value ? { background:'var(--accent)', color:'#fff', borderColor:'var(--accent)' } : {}"
                  @click="addEventForm.importance = lv.value">{{ lv.label }}</button>
          <button class="btn primary" :disabled="addingEvent" @click="submitAddEvent">{{ addingEvent ? '保存中…' : '保存' }}</button>
        </div>
        <input class="txt" v-model="addEventForm.description" placeholder="细节（可空）" style="width:100%; margin-top:8px">
        <div class="muted" style="font-size:var(--fs-xs); margin-top:4px">手动添加立即生效（来源=人工 · 置信度 100%）；同行人物可多选；日期可选，只知道大概时间可留空。</div>
      </div>

      <!-- 加指标表单（仿加事件表单）：选指标键 → 按 numeric 填数值/描述 + 单位 + 测量日期 -->
      <div class="card sunken" v-if="showAddMetric" style="margin-bottom:10px">
        <div class="kv" style="margin-bottom:8px"><b>加指标测点</b><button class="btn-link" @click="toggleAddMetric">✕</button></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
          <select class="txt" v-model="addMetricForm.metric_key" @change="onPickMetricKey" style="min-width:120px">
            <option value="" disabled>指标</option>
            <option v-for="m in METRIC_CATALOG" :key="m.key" :value="m.key">{{ m.label }}</option>
          </select>
          <!-- 数值型指标填 value_num；类别型填 value_text（据所选指标 numeric 切换输入框） -->
          <input v-if="addMetricDef && addMetricDef.numeric" class="txt" v-model="addMetricForm.value_num" type="number" step="any" placeholder="数值（如 70）*" style="width:auto; min-width:120px">
          <input v-else-if="addMetricDef" class="txt" v-model="addMetricForm.value_text" placeholder="描述（如 火锅）*" style="flex:1; min-width:140px">
          <input class="txt" v-model="addMetricForm.unit" placeholder="单位（可空）" style="width:auto; min-width:90px">
          <input class="txt" v-model="addMetricForm.measured_at" type="date" title="测量日期（留空取当前时间）" style="width:auto; min-width:130px">
          <button class="btn primary" :disabled="addingMetric" @click="submitAddMetric">{{ addingMetric ? '保存中…' : '保存' }}</button>
        </div>
        <div class="muted" style="font-size:var(--fs-xs); margin-top:4px">手动添加立即生效（来源=人工 · 置信度 100%）；数值型(体重/睡眠/情绪/精力)填数值、类别型(饮食/健康)填描述；时间留空取当前时间。</div>
      </div>

      <!-- 加属性表单 -->
      <div class="card sunken" v-if="showAddAttr" style="margin-bottom:10px">
        <div class="kv" style="margin-bottom:8px"><b>加属性</b><button class="btn-link" @click="toggleAddAttr">✕</button></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <input class="txt" list="attr-keys" v-model="addAttrForm.attr_key" @change="onAddAttrKeyChange" placeholder="属性 key（如 occupation）" style="flex:1; min-width:140px">
          <datalist id="attr-keys">
            <option v-for="d in attrCatalog" :key="d.key" :value="d.key">{{ d.label }}</option>
          </datalist>
          <!-- 值输入按目录 value_type 切换受控控件（F4 配套）：enum→select（空选项+枚举） / bool→是否(映射 true/false) / date→日期选择器 / 其余(含目录外自造 key)→自由文本 -->
          <select v-if="addAttrDef && addAttrDef.value_type === 'enum'" class="txt" v-model="addAttrForm.value" style="flex:1; min-width:140px">
            <option value="">请选择</option>
            <option v-for="opt in addAttrDef.enum_options" :key="opt" :value="opt">{{ opt }}</option>
          </select>
          <select v-else-if="addAttrDef && addAttrDef.value_type === 'bool'" class="txt" v-model="addAttrForm.value" style="flex:1; min-width:140px">
            <!-- option 的 value 直接是后端接受的 true/false 线值（Task 1 归一后即小写 true/false），
                 「是/否」仅作展示文案 → v-model 存的就是可直接提交的值，无需提交前额外映射 -->
            <option value="">请选择</option>
            <option value="true">是</option>
            <option value="false">否</option>
          </select>
          <input v-else-if="addAttrDef && addAttrDef.value_type === 'date'" class="txt" type="date" v-model="addAttrForm.value" style="flex:1; min-width:140px">
          <input v-else class="txt" v-model="addAttrForm.value" placeholder="值（如 后端工程师）" style="flex:1; min-width:140px">
          <button class="btn primary" :disabled="addingAttr" @click="submitAddAttr">{{ addingAttr ? '保存中…' : '保存' }}</button>
        </div>
        <div class="muted" style="font-size:var(--fs-xs); margin-top:4px">手动添加立即生效（来源=人工 · 置信度 100%）；单值属性重复添加 = 改值，旧值留痕可查历史。</div>
      </div>

      <!-- 加关系表单 -->
      <div class="card sunken" v-if="showAddRel" style="margin-bottom:10px">
        <div class="kv" style="margin-bottom:8px"><b>加关系</b><button class="btn-link" @click="toggleAddRel">✕</button></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
          <select class="txt" v-model="addRelForm.relation_type" style="min-width:100px">
            <option value="" disabled>关系类型</option>
            <option v-for="t in RELATION_TYPES" :key="t" :value="t">{{ t }}</option>
          </select>
          <span class="muted">→</span>
          <select class="txt" v-model="addRelForm.related_person_id" style="min-width:140px">
            <option value="">（对端人物，可空）</option>
            <option v-for="p in persons.filter(x => x.id !== personDetail.person.id)" :key="p.id" :value="p.id">{{ p.display_name }}</option>
          </select>
          <input class="txt" v-model="addRelForm.label" placeholder="称呼（如 老婆/大儿子，可空）" style="flex:1; min-width:120px">
          <select class="txt" v-model="addRelForm.direction" style="min-width:100px">
            <option value="">（上下游，可空）</option>
            <option v-for="d in DIRECTIONS" :key="d" :value="d">{{ d }}</option>
          </select>
          <input class="txt" v-model="addRelForm.org_name" placeholder="组织名（组织关系用，可空）" style="flex:1; min-width:120px">
          <button class="btn primary" :disabled="addingRel" @click="submitAddRel">{{ addingRel ? '保存中…' : '保存' }}</button>
        </div>
        <div class="muted" style="font-size:var(--fs-xs); margin-top:4px">对端人物可空（组织关系只填组织名）；手动添加立即生效（来源=人工 · 置信度 100%）。</div>
      </div>

      <!-- 修改历史抽屉 -->
      <div class="card sunken" v-if="attrHistory" style="margin-bottom:10px">
        <div class="kv" style="margin-bottom:8px">
          <b>「{{ attrLabel(attrHistory.attr_key) }}」修改历史</b>
          <button class="btn-link" @click="attrHistory=null">✕</button>
        </div>
        <div v-if="attrHistoryLoading" class="muted">加载中…</div>
        <template v-else>
          <div v-for="h in attrHistory.items" :key="h.id" class="seg">
            <span class="chip"
                  :style="h.changed_by === 'llm' ? { background:'var(--accent-soft)', color:'var(--accent)' } : { background:'var(--ok-soft)', color:'var(--ok)' }">
              {{ h.changed_by === 'llm' ? 'AI' : '人工' }} · {{ changeText(h.change_type) }}
            </span>
            <div class="seg-text">
              <div>
                <template v-if="h.old_value && h.new_value">{{ snapText(h.old_value) }} → <b>{{ snapText(h.new_value) }}</b></template>
                <template v-else-if="h.new_value"><b>{{ snapText(h.new_value) }}</b></template>
                <template v-else-if="h.old_value">删除了 {{ snapText(h.old_value) }}</template>
              </div>
              <div class="muted" style="font-size:var(--fs-xs)">{{ fmtTime(h.created_at) }}<span v-if="h.note"> · {{ h.note }}</span></div>
            </div>
          </div>
          <div v-if="!attrHistory.items.length" class="muted">无历史记录。</div>
        </template>
      </div>

      <div class="edit-actions">
        <button class="btn mini" @click="toggleAddAttr">{{ showAddAttr ? '收起加属性' : '＋ 加属性' }}</button>
        <button class="btn mini" @click="toggleAddRel">{{ showAddRel ? '收起加关系' : '＋ 加关系' }}</button>
        <button class="btn mini" @click="toggleAddEvent">{{ showAddEvent ? '收起加大事记' : '＋ 加大事记' }}</button>
        <button class="btn mini" @click="toggleAddMetric">{{ showAddMetric ? '收起加指标' : '＋ 加指标' }}</button>
      </div>
    </div>
    </template>

    <!-- 已删除人物折叠区（dismissed 软删行，默认收起；对齐已忽略主题的交互）。
         恢复=PATCH status=active：后端同一事务级联恢复删除时被连带清掉的六平面行
         （手动删过的行无 pre_dismiss_status 标记，保持 dismissed 不被误恢复）。 -->
    <template v-if="deletedPersons.length">
      <div class="todo-group-title" style="cursor:pointer" @click="deletedCollapsed = !deletedCollapsed">
        已删除（{{ deletedPersons.length }}）{{ deletedCollapsed ? ' ▸' : ' ▾' }}
      </div>
      <template v-if="!deletedCollapsed">
        <div class="card" v-for="p in deletedPersons" :key="p.id" style="opacity:.62">
          <div class="kv">
            <div style="min-width:0">
              <b><s>{{ p.display_name }}</s></b>
              <span v-if="p.source === 'llm'" class="muted">自动识别</span>
              <div class="muted" style="font-size:var(--fs-xs)">删除于 {{ fmtTime(p.updated_at) }} · 恢复将连带找回删除时被清掉的属性/关系等画像数据</div>
            </div>
            <button class="btn mini" @click="restorePerson(p)">恢复</button>
          </div>
        </div>
      </template>
    </template>
  </div>

  <!-- ============ 主题 ============ -->
  <div class="wrap" v-if="tab==='topics'">
    <!-- 列表视图 -->
    <template v-if="!topicDetail">
      <div class="kv" style="margin-bottom:12px">
        <b style="font-size:var(--fs-lg)">主题</b>
        <div style="display:flex; gap:6px">
          <button class="btn mini" :disabled="consolidating" @click="startConsolidate">
            <span v-if="consolidating" class="spinner"></span>{{ consolidating ? '合并中…' : '智能合并' }}
          </button>
          <button class="btn mini" @click="startManualMerge">手动合并</button>
          <button class="btn primary" style="padding:7px 16px" @click="toggleNewTopic">{{ showNewTopic ? '收起' : '＋ 新建' }}</button>
        </div>
      </div>
      <!-- 智能合并即时骨架（点击后立即出现） -->
      <div class="card" v-if="consolidating">
        <div class="muted" style="margin-bottom:6px"><span class="spinner"></span> 正在生成合并提议…</div>
        <div class="skeleton-line med"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
      <div class="card" v-if="mergeDraft">
        <div class="todo-group-title">合并提议（编辑后确认）</div>
        <div v-if="!mergeDraft.length" class="muted">暂无可合并组</div>
        <div v-for="(g, gi) in mergeDraft" :key="gi" style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px dashed var(--border)">
          <input class="txt" v-model="g.canonical_name" placeholder="规范名（必填）" style="margin-bottom:6px">
          <div v-for="m in g.members" :key="m.id" class="muted" style="margin:2px 0">
            <label><input type="checkbox" :checked="m.checked" @change="toggleMergeMember(g, m.id)"> {{ m.name }}</label>
          </div>
        </div>
        <div class="edit-actions" style="margin-top:8px">
          <button class="btn primary" @click="applyMerge">确认合并</button>
          <button class="btn mini" @click="mergeDraft = null">取消</button>
        </div>
      </div>
      <div class="card" v-if="showNewTopic">
        <div class="kv" style="margin-bottom:12px">
          <b style="font-size:var(--fs-md)">新建主题</b>
          <button class="btn-link" @click="cancelNewTopic">✕</button>
        </div>
        <label class="field-label" for="nt-name">主题名称</label>
        <input id="nt-name" class="txt" v-focus v-model="newTopic.name" placeholder="必填" @keyup.enter="createTopic" @keyup.esc="cancelNewTopic" style="margin-bottom:10px">

      <div class="toolbar" v-if="topics.length">

        <div class="kv">
          <div style="display:flex; align-items:center; gap:8px">
            <input v-if="manualMergeMode" type="checkbox" :checked="manualSelected.includes(t.id)" @change="toggleManualSelect(t)">

              <span v-if="suspectOf(t, topics)" class="badge" style="background:var(--warn-soft);color:var(--warn)">疑似可合并: {{ suspectOf(t, topics) }}</span>
              <div class="muted">{{ t.memory_count }} 条记忆 · {{ t.open_todo_count }} 个进行中待办</div>
            </div>
          </div>
          <div v-if="!manualMergeMode" style="display:flex; gap:6px; flex-shrink:0">
