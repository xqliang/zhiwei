services:
  mysql:
    image: mysql:8.4
    container_name: zhiwei-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: zhiwei
      MYSQL_PASSWORD: zhiwei
      MYSQL_DATABASE: zhiwei
    ports:
      - "3306:3306"
    volumes:
      - zhiwei-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  zhiwei-mysql-data:
